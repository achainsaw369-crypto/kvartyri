<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Квартиры">
<meta name="theme-color" content="#E9EEF1">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Мои квартиры</title>
<style>
:root{
  --bg:#E9EEF1; --surf:#FFFFFF; --ink:#18222D; --mute:#66727E; --line:#D7DEE4; --field:#F3F6F8;
  --acc:#1E5A82; --acc-ink:#FFFFFF; --acc-soft:#DCE8F1;
  --paid:#2E7D4E; --paid-bg:#DCEFE2; --part:#D3922A; --debt:#C23B2E; --debt-bg:#F8E0DC;
  --soon:#946405; --soon-bg:#F6EBCF; --empty:#DCE2E7; --ph:#9AA5AF;
}
html[data-theme=dark]{
  --bg:#0F1418; --surf:#182027; --ink:#E4EAEF; --mute:#93A0AB; --line:#2A343D; --field:#121A20;
  --acc:#7DB3DA; --acc-ink:#0F1418; --acc-soft:#1D3242;
  --paid:#6CC48D; --paid-bg:#1D3326; --part:#E0A64A; --debt:#F08A7E; --debt-bg:#3D2220;
  --soon:#E6B85A; --soon-bg:#3A3019; --empty:#26313A; --ph:#5F6C77;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);
  font:16px/1.4 -apple-system,"SF Pro Text",Roboto,system-ui,"Helvetica Neue",sans-serif;-webkit-text-size-adjust:100%}
body{position:fixed;left:0;right:0;top:0;display:flex;flex-direction:column}
#app{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:calc(8px + env(safe-area-inset-top)) max(14px,calc((100vw - 640px)/2)) 40px}
body.kb nav{display:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc)}
.num,.money{font-variant-numeric:tabular-nums}

/* заголовок экрана */
.hd{display:flex;align-items:center;gap:6px;margin:2px 0 14px;min-height:48px}
.hd h1{flex:1;min-width:0;margin:0;font-size:25px;line-height:1.15;font-weight:760;letter-spacing:-.015em}
.hd h1 small{display:block;font-size:13.5px;font-weight:500;color:var(--mute);letter-spacing:0;margin-top:3px;line-height:1.3}
.ib{flex:none;width:42px;height:42px;border:0;border-radius:50%;background:var(--surf);display:grid;place-items:center;color:var(--ink)}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib.acc{background:var(--acc);color:var(--acc-ink)}
.ib.back{background:none;margin-left:-10px}
.sync{flex:none;border:0;background:none;color:var(--mute);font-size:12.5px;display:flex;align-items:center;gap:5px;padding:6px 4px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ph)}
.sync.ok i{background:var(--paid)} .sync.err i{background:var(--debt)} .sync.run i{background:var(--acc);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.sync.run i{animation:none}}

/* группы и строки */
.gt{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:14px;font-weight:700;margin:22px 4px 8px}
.gt span{font-weight:500;color:var(--mute);font-size:13px}
.grp{background:var(--surf);border-radius:14px;overflow:hidden;margin:0 0 6px}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;min-height:52px;border:0;border-top:1px solid var(--line);
  background:none;text-align:left;text-decoration:none;color:inherit;font-size:16px}
.grp>.row:first-child,.grp>:first-child .row{border-top:0}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t small{display:block;color:var(--mute);font-size:13.5px;line-height:1.35;margin-top:1px}
.row .t small.wrap,.row .t b.wrap{white-space:normal}
.row .v{flex:none;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .v small{display:block;font-size:12.5px;color:var(--mute)}
.row.tap::after{content:"";flex:none;width:8px;height:8px;border:solid var(--ph);border-width:2px 2px 0 0;transform:rotate(45deg);margin-left:-2px}
.row.al{position:relative;padding-left:20px}
.row.al::before{content:"";position:absolute;left:8px;top:12px;bottom:12px;width:4px;border-radius:2px;background:var(--acc)}
.row.al.debt::before{background:var(--debt)} .row.al.soon::before{background:var(--part)}
.kv{display:flex;gap:12px;padding:11px 14px;border-top:1px solid var(--line);align-items:baseline}
.grp>.kv:first-child{border-top:0}
.kv span{flex:none;width:42%;color:var(--mute);font-size:14.5px}
.kv b{flex:1;font-weight:500;min-width:0;overflow-wrap:anywhere;white-space:pre-wrap}
.kv a{text-decoration:none;font-weight:600}
.note{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere}
.chip{display:inline-block;font-size:12.5px;font-weight:650;padding:2px 9px;border-radius:999px;background:var(--empty);color:var(--mute);white-space:nowrap}
.chip.paid{background:var(--paid-bg);color:var(--paid)} .chip.debt{background:var(--debt-bg);color:var(--debt)}
.chip.soon{background:var(--soon-bg);color:var(--soon)} .chip.acc{background:var(--acc-soft);color:var(--acc)}
.pos{color:var(--paid)} .neg{color:var(--debt)} .mute{color:var(--mute)}

/* кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:12px 16px;min-height:46px;
  background:var(--acc);color:var(--acc-ink);font-weight:650;font-size:15.5px;text-decoration:none;text-align:center;line-height:1.2}
.btn.ghost{background:var(--surf);color:var(--acc);box-shadow:inset 0 0 0 1px var(--line)}
.btn.danger{background:var(--surf);color:var(--debt);box-shadow:inset 0 0 0 1px var(--line)}
.btn.sm{min-height:36px;padding:7px 12px;font-size:14px;border-radius:10px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.btns .btn{flex:1 1 140px}
.btn:focus-visible,.row:focus-visible,.ib:focus-visible,.seg button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* сводка месяца */
.ledger{background:var(--surf);border-radius:16px;padding:16px 16px 14px;margin:0 0 6px}
.ledger .lh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ledger .lh b{font-size:17px}
.ledger .lh span{font-size:13.5px;color:var(--mute)}
.lg3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.lg3 small{display:block;font-size:12.5px;color:var(--mute)}
.lg3 b{display:block;font-size:clamp(15px,4.6vw,19px);font-weight:720;font-variant-numeric:tabular-nums;letter-spacing:-.01em;margin-top:2px;white-space:nowrap}
.bar{height:8px;border-radius:4px;background:var(--empty);margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--paid);border-radius:4px}
.ledger .foot{font-size:13.5px;color:var(--mute);margin-top:10px}

/* полоса месяцев: главный элемент приложения */
.strip{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin-top:8px}
.strip i{height:20px;border-radius:4px;background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.strip i.paid{background:var(--paid);box-shadow:none}
.strip i.part{background:var(--part);box-shadow:none}
.strip i.debt{background:var(--debt);box-shadow:none}
.strip i.soon{background:var(--soon-bg);box-shadow:inset 0 0 0 1.5px var(--part)}
.strip i.fut{background:var(--empty);box-shadow:none}
.strip i.now{outline:2px solid var(--ink);outline-offset:1px}
.strip.lb{margin-top:3px}
.strip.lb span{font-size:10px;text-align:center;color:var(--mute);line-height:1}
.cstrip{display:block;padding:13px 14px;border-top:1px solid var(--line);text-decoration:none;color:inherit;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.grp>.cstrip:first-child{border-top:0}
.cstrip .top{display:flex;gap:10px;align-items:baseline}
.cstrip .top b{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mute);margin:8px 4px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* баланс договора */
.bal{background:var(--surf);border-radius:16px;padding:16px;margin:0 0 6px}
.bal .big{font-size:30px;font-weight:760;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1}
.bal .lbl{font-size:13.5px;color:var(--mute)}
.bal .meta{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:14px;color:var(--mute)}
.bal .meta b{color:var(--ink);font-weight:600}

/* формы */
.form{background:var(--surf);border-radius:14px;padding:14px 14px 4px;margin:0 0 6px;display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.form>*{grid-column:1/-1}
.form>.half{grid-column:auto}
.fld{display:block;margin:0 0 13px;min-width:0}
.fld>span{display:block;font-size:13.5px;color:var(--mute);margin:0 0 5px;font-weight:600}
.fld em{display:block;font-style:normal;font-size:12.5px;color:var(--mute);margin-top:4px}
input,select,textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--field);border-radius:10px;padding:11px 12px;font-size:16px;color:var(--ink);-webkit-appearance:none;appearance:none}
input[type=date]{min-height:46px}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
textarea{min-height:76px;resize:vertical;line-height:1.4}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:transparent}
::placeholder{color:var(--ph)}
.fsec{font-size:16px;font-weight:720;margin:14px 0 10px}
.fsec:first-child{margin-top:2px}
.chk{display:flex;align-items:flex-start;gap:10px;margin:2px 0 14px;font-size:15.5px}
.chk input{width:22px;height:22px;flex:none;margin:0;-webkit-appearance:checkbox;appearance:auto;accent-color:var(--acc)}
.rws{margin:0 0 12px}
.rwf{border:1px solid var(--line);border-radius:12px;padding:10px 10px 0;margin:0 0 8px;display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:0 8px;position:relative}
.rwf .x{position:absolute;right:4px;top:2px;border:0;background:none;color:var(--mute);font-size:22px;line-height:1;padding:4px 8px}
.rwf .fld{margin-bottom:10px}
.rwf .fld:first-of-type>span{padding-right:26px}
.hint{font-size:13.5px;color:var(--mute);margin:0 0 12px;line-height:1.45}

/* переключатели */
.seg{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:0;padding:8px 13px;border-radius:999px;background:var(--surf);color:var(--mute);font-weight:600;font-size:14.5px}
.seg button.on{background:var(--ink);color:var(--bg)}
.mon{display:flex;align-items:center;gap:8px;margin:0 0 12px}
.mon b{flex:1;text-align:center;font-size:17px}
.search{margin:0 0 12px}

.empty{text-align:center;padding:30px 18px;color:var(--mute)}
.empty p{margin:0 0 16px;line-height:1.5}
.empty.card{background:var(--surf);border-radius:14px;padding:22px 16px}

/* отчёт */
.bars{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:110px;padding:14px 14px 0}
.bars div{display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:2px}
.bars i{display:block;border-radius:3px 3px 0 0;background:var(--paid);min-height:2px}
.bars i.e{background:var(--debt);opacity:.75}
.bars.lb{height:auto;padding:4px 14px 12px}
.bars.lb span{font-size:10px;text-align:center;color:var(--mute)}
table.rep{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
table.rep th,table.rep td{padding:9px 6px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
table.rep th{color:var(--mute);font-weight:600;font-size:13px;border-top:0}
table.rep td:first-child,table.rep th:first-child{text-align:left;padding-left:14px}
table.rep td:last-child,table.rep th:last-child{padding-right:14px}
table.rep tr.tot td{font-weight:700}
.tbl{overflow-x:auto}

.doc{background:var(--surf);border-radius:14px;padding:18px 16px;white-space:pre-wrap;line-height:1.55;font-size:15px;overflow-wrap:anywhere}
.secret{filter:blur(6px)}

/* нижняя панель */
nav{flex:none;background:var(--surf);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom)}
.tab{border:0;background:none;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mute);border-top:3px solid transparent;margin-top:-1px}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--ink);border-top-color:var(--acc);font-weight:650}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-size:14.5px;max-width:min(92vw,460px);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;text-align:center}
#toast.on{opacity:1}

/* экран PIN */
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px}
#lock.on{display:flex}
#lock h2{margin:0;font-size:20px}
.dots{display:flex;gap:14px}
.dots i{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--mute)}
.dots i.f{background:var(--ink);box-shadow:none}
.dots.bad{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,74px);gap:14px}
.pad button{height:74px;border-radius:50%;border:0;background:var(--surf);font-size:27px;font-weight:500}
.pad button.nb{background:none;font-size:15px;color:var(--mute)}

/* список квартир */
.fl{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;color:inherit;font-size:16px}
.grp>.fl:first-child{border-top:0}
.fl .t{flex:1;min-width:0}
.fl .t b{display:block;font-weight:650;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fl .t b span{font-weight:400;color:var(--mute);font-size:15px}
.fl .t small{display:block;color:var(--mute);font-size:14px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fl .v{flex:none;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.fl .v small{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
/* сводка-таблица */
.srow,.shead{display:grid;grid-template-columns:minmax(0,1fr) 92px 96px;gap:10px;align-items:center;padding:11px 14px;width:100%;border:0;border-top:1px solid var(--line);background:none;text-align:left;color:inherit;font-size:15px}
.shead{border-top:0;padding-top:9px;padding-bottom:7px;font-size:12.5px;color:var(--mute);font-weight:600}
.shead>:not(:first-child),.srow>:not(:first-child){text-align:right}
.srow b{display:block;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
.srow small{display:block;color:var(--mute);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
.srow .soonc{color:var(--soon)}
.srow.tot{font-weight:700;background:var(--field)}
/* блок жильца в карточке квартиры */
.who{display:flex;align-items:center;gap:10px;margin:0 0 12px;padding:0 0 12px;border-bottom:1px solid var(--line)}
.who .t{flex:1;min-width:0}
.who .t b{display:block;font-size:17px;font-weight:650}
.who .t a{font-size:15px;text-decoration:none;font-variant-numeric:tabular-nums}
.who .lnk{border:0;background:none;padding:0;color:inherit;text-align:left;font:inherit}
.bal .sub{font-size:14.5px;color:var(--mute);margin-top:3px}
.bal .line{font-size:15px;margin-top:10px}
.bal .line b{font-variant-numeric:tabular-nums}
.paybtn{width:100%;margin-top:14px;min-height:52px;font-size:17px}
.qp{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.qp>*{grid-column:1/-1}.qp>.half{grid-column:auto}
.qp input.big{font-size:24px;font-weight:700;padding:12px;font-variant-numeric:tabular-nums}
.advt{margin:4px 0 14px}
.ftabs{display:flex;flex-wrap:wrap;gap:4px;background:var(--surf);border-radius:12px;padding:4px;margin:0 0 14px;overflow-x:auto;scrollbar-width:none}
.ftabs::-webkit-scrollbar{display:none}
.ftabs button{flex:1 1 auto;border:0;background:none;padding:9px 5px;border-radius:9px;font-size:clamp(12.5px,3.55vw,14px);font-weight:600;color:var(--mute);white-space:nowrap}
.ftabs button.on{background:var(--ink);color:var(--bg)}
.tenant{margin:0 0 14px;padding:0 0 14px;border-bottom:1px solid var(--line)}
.tenant .name{display:block;font-size:19px;font-weight:700;line-height:1.25;border:0;background:none;padding:0;color:inherit;text-align:left;font-family:inherit}
.callbtn{display:flex;width:100%;margin-top:10px;font-size:17px;font-variant-numeric:tabular-nums}
.callbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.yr{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;font-size:13px;color:var(--mute)}
.mcard{background:var(--surf);border-radius:14px;margin:0 0 10px;overflow:hidden}
.mcard .mh{display:flex;align-items:center;gap:10px;padding:13px 14px 4px;width:100%;border:0;background:none;text-align:left;color:inherit}
.mcard .mh b{flex:1;min-width:0;font-size:16.5px;font-weight:650}
.mcard .mh small{color:var(--mute);font-weight:400;font-size:14px}
.mcard .kv{padding:8px 14px}
.mcard .kv span{width:48%}
.mcard .acts{display:flex;gap:8px;padding:6px 14px 14px}
.mcard .acts .btn{flex:1}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:14px;overflow:hidden}
.stat div{background:var(--surf);padding:12px 14px}
.stat small{display:block;font-size:12.5px;color:var(--mute)}
.stat b{display:block;font-size:18px;font-weight:720;font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap}
#print{display:none}
@media print{
  body{position:static;display:block;height:auto!important;overflow:visible}
  html,body{overflow:visible;height:auto;background:#fff;color:#000}
  #app,nav,#toast,#lock{display:none!important}
  #print{display:block;white-space:pre-wrap;font:12pt/1.5 Georgia,"Times New Roman",serif;padding:0 8mm}
}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<div id="toast"></div>
<div id="lock"></div>
<div id="print"></div>
<noscript>Для работы приложения нужен JavaScript.</noscript>
<script>
'use strict';
/* ================= основа ================= */
const VERSION='1.0.0';
/* Android-приложение: при сборке на GitHub сюда подставляется «владелец/репозиторий», откуда берутся новые версии APK */
const GH_REPO='';
const KEY='kvartiry.v1', DEVKEY='kvartiry.device';
const NP=window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()?Capacitor.Plugins||{}:null;
const IS_NATIVE=!!NP;
const COLS=['houses','flats','meters','readings','tenants','contracts','charges','payments','expenses','tasks'];

const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

const pd=s=>{const[y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const dim=(y,m)=>new Date(y,m+1,0).getDate();
function addM(s,k){const[y,m,d]=s.split('-').map(Number);const t=new Date(y,m-1+k,1),yy=t.getFullYear(),mm=t.getMonth();return`${yy}-${pad(mm+1)}-${pad(Math.min(d,dim(yy,mm)))}`}
function addD(s,n){const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)}
const diffD=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const ym=s=>String(s||'').slice(0,7);
const eom=k=>{const[y,m]=k.split('-').map(Number);return`${k}-${pad(dim(y,m-1))}`};

const cap=s=>s?s[0].toUpperCase()+s.slice(1):'';
const fD=s=>{if(!s)return'';const[y,m,d]=s.split('-');return`${d}.${m}.${y}`};
const fDl=s=>{if(!s)return'';const d=pd(s);return`${d.getDate()} ${MONG[d.getMonth()]}${d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():''}`};
const fYM=k=>{const[y,m]=k.split('-').map(Number);return cap(MON[m-1])+' '+y};
const fM=n=>{n=r2(n);return n.toLocaleString('ru-RU',{minimumFractionDigits:Number.isInteger(n)?0:2,maximumFractionDigits:2})+'\u00a0₽'};
const plural=(n,a,b,c)=>{n=Math.abs(n)%100;const k=n%10;return n>10&&n<20?c:k===1?a:k>1&&k<5?b:c};
const days=n=>n+'\u00a0'+plural(n,'день','дня','дней');

function emptyDb(){const d={schema:1,tomb:{},cfg:defaultCfg()};COLS.forEach(c=>d[c]=[]);return d}
function normalize(d){
  const o=d&&typeof d==='object'?d:{};
  COLS.forEach(c=>{if(!Array.isArray(o[c]))o[c]=[]});
  if(!o.tomb||typeof o.tomb!=='object')o.tomb={};
  o.cfg=Object.assign(defaultCfg(),o.cfg||{});
  o.schema=1;
  return o;
}

function shortFio(f){const p=String(f||'').trim().split(/\s+/).filter(Boolean);if(!p.length)return'Без имени';return p[0]+(p[1]?' '+p[1][0]+'.':'')+(p[2]?' '+p[2][0]+'.':'')}

const INFO_KEYS=['address','intercom','shutoff','parking','year','floors','uk','ukPhone','ukDisp','ukEmail','ukSite','chairman','chairmanPhone','emergency','houseNotes'];
function addrShort(f){const a=String((f&&f.address)||'').trim(),p=a.split(',').map(x=>x.trim()).filter(Boolean);return p.length>=3?p.slice(1).join(', '):a||'Без адреса'}

function migrateHouses(){
  let ch=false;
  for(const f of db.flats){
    if(!f.house||f.address)continue;
    const h=G('houses',f.house);if(!h)continue;
    INFO_KEYS.forEach(k=>{const hk=k==='houseNotes'?'notes':k;if((f[k]==null||f[k]==='')&&h[hk]!=null&&h[hk]!=='')f[k]=clone(h[hk])});
    f.upd=Date.now();ch=true;
  }
  if(ch){inval();save(true)}
  return ch;
}

/* ================= расчёты по договору ================= */
const isActive=c=>c.status!=='closed';
const cfgN=(v,def)=>{const n=numv(v);return n==null?def:n};
/* участки графика: с даты первого платежа и с каждой даты изменения суммы платёж идёт ежемесячно в это число */
function segs(c){
  const a=[{s:c.firstDue,a:+c.rent||0,base:1}];
  (c.rates||[]).forEach(r=>{if(r.from&&r.amount!=null)a.push({s:r.from,a:+r.amount||0})});
  a.sort((x,y)=>x.s<y.s?-1:x.s>y.s?1:(x.base?-1:1));
  return a.filter((x,i)=>!(a[i+1]&&a[i+1].s===x.s));
}
function rateAt(c,d){let v=+c.rent||0;if(!c.firstDue)return v;for(const x of segs(c))if(x.s<=d)v=x.a;return v}
const amtAt=(c,d)=>rateAt(c,d)+(c.utilMode==='fixed'?(+c.utilFixed||0):0);
function cEnd(c){let e='9999-12-31';if(c.dateEnd&&!c.auto&&c.dateEnd<e)e=c.dateEnd;if(c.status==='closed'&&c.closeDate&&c.closeDate<e)e=c.closeDate;return e}
function dues(c,until){
  const out=[];if(!c.firstDue)return out;const e=cEnd(c),sg=segs(c);
  for(let i=0;i<sg.length;i++){
    const stop=sg[i+1]?sg[i+1].s:'9999-12-31';
    for(let k=0;k<2400;k++){const d=addM(sg[i].s,k);if(d>=stop||d>until||d>e)break;out.push(d)}
  }
  return out;
}
function nextDue(c,after){return dues(c,addM(after,13)).find(d=>d>after)||null}

/* начисления аренды создаются сами в день платежа; id предсказуемые — на двух устройствах не будет дублей */
function genCharges(){
  const t=today(),now=Date.now();let changed=false;
  const byId=idx('charges');
  for(const c of db.contracts){
    const want=[];
    const seenM=new Set();
    for(const d of dues(c,t)){
      const key=seenM.has(ym(d))?d:ym(d);seenM.add(ym(d));   // два платежа в одном месяце (после смены дня) — второй с полной датой
      want.push({id:`r_${c.id}_${key}`,kind:'rent',date:d,amount:rateAt(c,d)});
      if(c.utilMode==='fixed'&&+c.utilFixed>0)want.push({id:`u_${c.id}_${key}`,kind:'util',date:d,amount:+c.utilFixed});
    }
    if(+c.deposit>0&&(c.dateStart||c.firstDue))want.push({id:`d_${c.id}`,kind:'deposit',date:c.dateStart||c.firstDue,amount:+c.deposit});
    const exp=new Set();
    for(const w of want){
      exp.add(w.id);const ex=byId.get(w.id);
      if(!ex){if(db.tomb[w.id])continue;db.charges.push({...w,contract:c.id,auto:1,upd:now});changed=true}
      else if(!ex.edited){
        if(ex.void&&ex.voidAuto){ex.void=0;ex.voidAuto=0;ex.upd=now;changed=true}
        if(r2(ex.amount)!==r2(w.amount)||ex.date!==w.date){ex.amount=w.amount;ex.date=w.date;ex.upd=now;changed=true}
      }
    }
    for(const ch of db.charges)if(ch.contract===c.id&&ch.auto&&!ch.edited&&!ch.void&&!exp.has(ch.id)){ch.void=1;ch.voidAuto=1;ch.upd=now;changed=true}
  }
  if(changed)save(true);
}

function ci(c){
  if(CI.has(c.id))return CI.get(c.id);
  const t=today(),grace=cfgN(c.grace,cfgN(db.cfg.grace,0)),pen=cfgN(c.penalty,cfgN(db.cfg.penalty,0));
  const ch=db.charges.filter(x=>x.contract===c.id&&!x.void).sort(byDate);
  const pays=db.payments.filter(x=>x.contract===c.id).sort(byDate);
  const rentCh=ch.filter(x=>x.kind!=='deposit');
  const payIn=pays.filter(p=>p.kind==='pay'||p.kind==='offset');
  const al=new Map(rentCh.map(x=>[x.id,{paid:0,pen:0,paidDate:null}]));
  const rem=rentCh.map(x=>({c:x,r:r2(x.amount)}));
  let i=0;
  for(const p of payIn){
    let a=r2(p.amount);
    while(a>0.004&&i<rem.length){
      const q=rem[i],x=Math.min(a,q.r);q.r=r2(q.r-x);a=r2(a-x);
      const st=al.get(q.c.id);st.paid=r2(st.paid+x);
      const late=diffD(addD(q.c.date,grace),p.date);
      if(late>0&&pen>0&&q.c.kind!=='penalty')st.pen+=x*pen/100*late;
      if(q.r<=0.004){st.paidDate=p.date;i++}
    }
  }
  let overdue=0,oldest=null,pend=0,pendDate=null;
  for(const q of rem){
    if(q.r<=0.004)continue;
    const due=addD(q.c.date,grace);
    if(due<t){overdue+=q.r;if(!oldest||q.c.date<oldest)oldest=q.c.date;if(pen>0&&q.c.kind!=='penalty')al.get(q.c.id).pen+=q.r*pen/100*diffD(due,t)}
    else{pend+=q.r;if(!pendDate||q.c.date<pendDate)pendDate=q.c.date}
  }
  const sum=(a,f)=>a.reduce((s,x)=>s+(f?f(x):+x.amount||0),0);
  const charged=r2(sum(rentCh)),paid=r2(sum(payIn)),bal=r2(charged-paid);
  const sumK=k=>r2(sum(pays.filter(p=>p.kind===k)));
  const depCharged=r2(sum(ch.filter(x=>x.kind==='deposit'))),depGot=sumK('deposit');
  const depHeld=r2(depGot-sumK('refund')-sumK('offset'));
  const penCalc=r2([...al.values()].reduce((s,x)=>s+x.pen,0));
  const penCharged=r2(sum(rentCh.filter(x=>x.kind==='penalty')));
  const next=isActive(c)?nextDue(c,t):null;
  const months={};
  for(const x of rentCh){
    const st=al.get(x.id),k=ym(x.date);
    let s=st.paid>=r2(x.amount)-0.004?'paid':addD(x.date,grace)<t?(st.paid>0?'part':'debt'):'soon';
    months[k]=worse(months[k],s);
  }
  const r={ch,pays,al,charged,paid,bal,overdue:r2(overdue),oldest,pend:r2(pend),pendDate,depCharged,depGot,depHeld,depDue:r2(Math.max(0,depCharged-depGot)),
    penCalc,penCharged,next,nextAmt:next?amtAt(c,next):0,months,grace,pen};
  CI.set(c.id,r);return r;
}
const RANK={none:0,fut:1,paid:2,soon:3,part:4,debt:5};
const worse=(a,b)=>!a?b:!b?a:RANK[b]>RANK[a]?b:a;
function cMonth(c,k){
  const i=ci(c);if(i.months[k])return i.months[k];
  const s=ym(c.firstDue||c.dateStart),e=ym(cEnd(c)),now=ym(today());
  if(s&&k>=s&&k<=e&&k>=now&&isActive(c))return'fut';
  return'none';
}
function yearMonths(y){y=y||+today().slice(0,4);return Array.from({length:12},(_,i)=>`${y}-${pad(i+1)}`)}
function strip(fn,y){
  const ms=yearMonths(y),now=ym(today());
  return`<div class="strip">${ms.map(k=>`<i class="${fn(k)}${k===now?' now':''}" title="${fYM(k)}"></i>`).join('')}</div>
  <div class="strip lb">${ms.map(k=>`<span>${MON1[+k.slice(5)-1]}</span>`).join('')}</div>`;
}
/* сводный статус месяца по всем договорам квартиры */
function flatMonth(f,k){let s='none';db.contracts.filter(c=>c.flat===f.id).forEach(c=>{s=worse(s,cMonth(c,k))});return s}
const legend=()=>`<div class="legend"><span><i style="background:var(--paid)"></i>оплачен</span><span><i style="background:var(--part)"></i>частично</span><span><i style="background:var(--debt)"></i>долг</span><span><i style="background:var(--soon-bg);box-shadow:inset 0 0 0 1.5px var(--part)"></i>ждём оплату</span></div>`;
function balChip(i){
  if(i.overdue>0)return`<span class="chip debt">долг ${fM(i.overdue)}</span>`;
  if(i.bal>0.004)return`<span class="chip soon">к оплате ${fM(i.bal)}</span>`;
  if(i.bal<-0.004)return`<span class="chip paid">аванс ${fM(-i.bal)}</span>`;
  return`<span class="chip paid">оплачено</span>`;
}
function taxRate(c){const cf=db.cfg;if(cf.tax==='npd')return(c&&c.payer==='company'?cfgN(cf.npdCompany,6):cfgN(cf.npdPerson,4))/100;if(cf.tax==='ndfl')return cfgN(cf.ndfl,13)/100;return 0}
const isIncome=p=>p.kind==='pay'||p.kind==='offset';

/* счётчики */
function meterType(m){return(db.cfg.meterTypes||[]).find(x=>x.t===m.type)}
function nextVerify(m){
  if(m.nextVerify)return m.nextVerify;
  if(!m.verifyDate&&!m.install)return null;
  const y=numv(m.years)??numv((meterType(m)||{}).y);
  return y?addM(m.verifyDate||m.install,Math.round(y*12)):null;
}
function readingsOf(id){return db.readings.filter(r=>r.meter===id).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(b.upd||0)-(a.upd||0))}
function lastReading(id){return readingsOf(id)[0]}

/* ================= что требует внимания ================= */
function alerts(){
  const t=today(),cf=db.cfg,out=[];
  for(const c of db.contracts){
    const i=ci(c),lbl=cLabel(c),r={v:'contract',id:c.id};
    if(i.overdue>0)out.push({pay:1,l:'debt',w:-diffD(i.oldest,t),title:`Долг ${fM(i.overdue)}`,sub:`${lbl}, просрочка ${days(diffD(i.oldest,t))}`,r});
    if(!isActive(c))continue;
    if(i.next){const dl=diffD(t,i.next),need=r2(i.nextAmt+Math.min(0,i.bal));
      if(dl<=cfgN(cf.dueSoon,3)&&need>0.004)out.push({pay:1,l:'soon',w:dl,title:`${dl===0?'Сегодня':dl===1?'Завтра':'Через '+days(dl)} платёж ${fM(need)}`,sub:lbl,r})}
    if(c.dateEnd&&!c.auto){const dl=diffD(t,c.dateEnd);
      if(dl<0)out.push({l:'debt',w:dl,title:'Срок договора истёк',sub:`${lbl}: продлите или завершите договор`,r});
      else if(dl<=cfgN(cf.endSoon,30))out.push({l:'soon',w:dl,title:`Договор заканчивается ${fDl(c.dateEnd)}`,sub:lbl,r})}
    if(i.depDue>0)out.push({l:'soon',w:50,title:`Залог внесён не полностью: ещё ${fM(i.depDue)}`,sub:lbl,r});
  }
  for(const m of db.meters){
    if(m.off||!G('flats',m.flat))continue;
    const nv=nextVerify(m);if(!nv)continue;const dl=diffD(t,nv);
    const sub=`${m.type||'Счётчик'}${m.serial?' № '+m.serial:''}, ${flatLabel(G('flats',m.flat))}`;
    if(dl<0)out.push({l:'debt',w:dl,title:'Поверка счётчика просрочена',sub,r:{v:'meter',id:m.id}});
    else if(dl<=cfgN(cf.verifySoon,60))out.push({l:'soon',w:dl,title:`Поверка счётчика ${fDl(nv)}`,sub,r:{v:'meter',id:m.id}});
  }
  const day=new Date().getDate(),from=cfgN(cf.readFrom,0),to=cfgN(cf.readTo,0);
  if(from&&to&&day>=from&&day<=to){
    const m=ym(t);
    for(const f of db.flats){
      const ms=db.meters.filter(x=>x.flat===f.id&&!x.off);if(!ms.length)continue;
      if(ms.some(x=>{const r=lastReading(x.id);return!r||ym(r.date)!==m}))
        out.push({l:'info',w:200,title:'Передать показания счётчиков',sub:`${flatLabel(f)}, до ${to} числа`,r:{v:'readings',flat:f.id}});
    }
  }
  for(const k of db.tasks){
    if(k.done||!k.date)continue;const dl=diffD(t,k.date);
    if(dl<=1)out.push({l:dl<0?'debt':'soon',w:dl,title:k.text||'Задача',sub:`${dl<0?'Просрочено, ':''}${dl===1?'завтра':fDl(k.date)}${k.flat?', '+flatLabel(G('flats',k.flat)):''}`,r:{v:'tasks'}});
  }
  if(cf.tax==='npd'){
    const np=db.payments.filter(p=>isIncome(p)&&!p.receipt);
    if(np.length)out.push({l:'info',w:300,title:`Чеки не выбиты: ${np.length}`,sub:`На сумму ${fM(np.reduce((s,p)=>s+(+p.amount||0),0))}`,r:{v:'receipts'}});
  }
  if(!syncReady()&&db.contracts.length&&(!dev.lastBackup||Date.now()-dev.lastBackup>14*864e5))
    out.push({l:'info',w:400,title:'Нет резервной копии',sub:'Включите синхронизацию или сохраните копию',r:{v:'sync'}});
  const L={debt:0,soon:1,info:2};
  return out.sort((a,b)=>L[a.l]-L[b.l]||a.w-b.w);
}

function syncChip(){

function timeAgo(ts){const m=Math.round((Date.now()-ts)/6e4);if(m<1)return'только что';if(m<60)return m+' мин назад';const d=new Date(ts);return Date.now()-ts<864e5?`${pad(d.getHours())}:${pad(d.getMinutes())}`:fD(ymd(d))}

/* когда и сколько платить: то, что начислено и ещё не просрочено, или следующий платёж */
function payWhen(i){
  if(i.pend>0.004)return{date:i.pendDate,amt:i.pend,now:true};
  if(i.next){const need=r2(i.nextAmt+Math.min(0,i.bal));return{date:i.next,amt:Math.max(0,need),ahead:need<=0.004}}
  return null;
}

function flatContracts(f){return db.contracts.filter(c=>c.flat===f.id&&isActive(c))}
function sortFlats(a,b){return addrShort(a).localeCompare(addrShort(b),'ru')||String(a.num).localeCompare(String(b.num),'ru',{numeric:true})}

function flatItem(f){

    let line='';
    if(pw)line=pw.ahead?`оплачено до ${fDs(pw.date)}`:`${fM(pw.amt)} · ${whenText(pw.date)}`;
    const soon=pw&&!pw.ahead&&diffD(today(),pw.date)<=cfgN(db.cfg.dueSoon,3);
    right=(od>0?`<span class="chip debt">долг ${fM(od)}</span>`:pw&&pw.now?`<span class="chip soon">к оплате</span>`:soon?`<span class="chip soon">скоро платёж</span>`:`<span class="chip paid">оплачено</span>`)+(line?`<small>${line}</small>`:'');
  }
  return`<button class="fl" data-a="go" data-v="flat" data-id="${f.id}"><div class="t"><b>${esc(cap(flatShort(f)))} <span>· ${esc(addrShort(f))}</span></b><small>${esc(sub)}</small></div><div class="v">${right}</div></button>`;
}

P.summary=()=>{

  const act=db.contracts.filter(isActive);

    .sort((a,b)=>{if(b.i.overdue!==a.i.overdue)return b.i.overdue-a.i.overdue;const x=(a.pw&&a.pw.date)||'9',y=(b.pw&&b.pw.date)||'9';return x<y?-1:x>y?1:0});
  if(rows.length){
    const totNext=rows.reduce((s,x)=>s+(x.pw&&!x.pw.ahead?x.pw.amt:0),0),totDebt=rows.reduce((s,x)=>s+x.i.overdue,0);
    h+=`<div class="gt">Кто и когда платит<span>${rows.length} ${plural(rows.length,'жилец','жильца','жильцов')}</span></div><div class="grp">
      <div class="shead"><span>Квартира</span><span>Платёж</span><span>Долг</span></div>
      ${rows.map(x=>{const pw=x.pw,soon=pw&&!pw.ahead&&diffD(t,pw.date)<=cfgN(db.cfg.dueSoon,3);

        <div>${pw?pw.ahead?`<b class="pos">оплачено</b><small>до ${fDs(pw.date)}</small>`:`<b class="${soon?'soonc':''}">${whenText(pw.date)}</b><small>${fM(pw.amt)}</small>`:'<span class="mute">—</span>'}</div>
        <div>${x.i.overdue>0?`<b class="neg">${fM(x.i.overdue)}</b><small>${days(diffD(x.i.oldest,t))}</small>`:'<span class="mute">—</span>'}</div></button>`}).join('')}
      <div class="srow tot"><div>Итого</div><div class="num">${fM(totNext)}</div><div class="num ${totDebt>0?'neg':''}">${fM(totDebt)}</div></div></div>`;
    h+=`<p class="hint" style="margin:8px 4px 0">«Платёж» — ближайшая сумма и дата: то, что уже начислено и ещё не просрочено, или следующий платёж. «Долг» — просроченная сумма.</p>`;

  const free=db.flats.filter(f=>!flatContracts(f).length).sort(sortFlats);

    h+=`</div>${legend()}`;

  /* --- параметры --- */
  if(ft==='params'){
    o+=`<div class="btns" style="margin-top:0"><button class="btn" data-a="edit" data-col="flats" data-id="${f.id}">Изменить параметры</button></div>`;
    const par=[['Адрес',f.address],['Номер',f.num],['Тип',f.type],['Комнат',f.rooms],['Площадь',f.area?f.area+' м²':''],['Подъезд',f.entrance],['Этаж',f.floor],['Кадастровый номер',f.cadastral,'copy'],['Собственник',f.owner],['Ставка аренды',f.rentBase,'money']].filter(x=>x[1]);
    o+=`<div class="gt">Основное</div><div class="grp">${par.map(kvRow).join('')}</div>`;
    const acc=[['Код домофона',f.intercom],['Ключи',f.keys],['Wi-Fi',f.wifi],['Пароль Wi-Fi',f.wifiPass,'secret']].filter(x=>x[1]);
    if(acc.length)o+=`<div class="gt">Доступ</div><div class="grp">${acc.map(kvRow).join('')}</div>`;
    const ac=(f.accounts||[]).filter(x=>x.t||x.n);
    if(ac.length)o+=`<div class="gt">Лицевые счета</div><div class="grp">${ac.map(x=>`<button class="row" data-a="copy" data-t="${esc(x.n||'')}"><div class="t"><b>${esc(x.t||'Счёт')}</b><small>${esc([x.n,x.note].filter(Boolean).join(' · '))}</small></div><div class="v mute" style="font-size:13px">${x.n?'копировать':''}</div></button>`).join('')}</div>`;
    const inv=(f.inv||[]).filter(x=>x.n);
    if(inv.length)o+=`<div class="gt">Опись имущества<span>${inv.length}</span></div><div class="grp">${inv.map(x=>`<div class="row"><div class="t"><b class="wrap">${esc(x.n)}</b>${x.s?`<small>${esc(x.s)}</small>`:''}</div><div class="v">${x.q?esc(x.q)+' шт.':''}</div></div>`).join('')}</div>`;
    if(f.notes)o+=`<div class="gt">Заметки</div><div class="grp"><div class="note">${esc(f.notes)}</div></div>`;
    return o;
  }
  /* --- счётчики --- */
  if(ft==='meters'){
    const ms=db.meters.filter(m=>m.flat===f.id).sort((a,b)=>(a.off?1:0)-(b.off?1:0)||String(a.type).localeCompare(String(b.type),'ru'));
    const act=ms.filter(m=>!m.off);
    if(act.length)o+=`<div class="btns" style="margin-top:0"><button class="btn" data-a="go" data-v="readings" data-flat="${f.id}">Внести показания</button><button class="btn ghost" data-a="checkall" data-id="${f.id}">Проверил все сегодня</button></div>`;
    if(!ms.length)o+=`<div class="empty card"><p>Счётчиков пока нет. Добавьте их, чтобы следить за поверкой и показаниями.</p></div>`;
    o+=ms.map(m=>{
      const nv=nextVerify(m),lc=lastCheck(m),lr=lastReading(m.id);
      let vchip='';if(!m.off&&nv){const dl=diffD(t,nv);vchip=dl<0?' <span class="chip debt">просрочена</span>':dl<=cfgN(db.cfg.verifySoon,60)?` <span class="chip soon">через ${days(dl)}</span>`:''}
      const ago=lc?diffD(lc,t):null;
      return`<div class="mcard"><button class="mh" data-a="go" data-v="meter" data-id="${m.id}"><b>${esc(m.type||'Счётчик')} ${m.serial?`<small>№ ${esc(m.serial)}</small>`:''}</b>${m.off?'<span class="chip">снят</span>':''}<span aria-hidden="true" style="flex:none;width:8px;height:8px;border:solid var(--ph);border-width:2px 2px 0 0;transform:rotate(45deg);margin-right:4px"></span></button>
        <div class="kv"><span>Следующая поверка</span><b>${nv?fD(nv)+vchip:'—'}</b></div>
        <div class="kv"><span>Последняя поверка</span><b>${m.verifyDate?fD(m.verifyDate):'—'}</b></div>
        <div class="kv"><span>Последний контроль</span><b>${lc?fD(lc)+` <span class="mute">${ago===0?'сегодня':days(ago)+' назад'}</span>`:'—'}</b></div>
        <div class="kv"><span>Последнее показание</span><b>${lr?`${fmtNum(lr.value)} ${esc(m.unit||'')} <span class="mute">на ${fD(lr.date)}</span>`:'—'}</b></div>
        ${m.off?'':`<div class="acts"><button class="btn ghost sm" data-a="checkone" data-id="${m.id}">Проверил сегодня</button><button class="btn ghost sm" data-a="new" data-col="readings" data-p='${esc(JSON.stringify({meter:m.id}))}'>Показание</button></div>`}</div>`}).join('');
    o+=`<div class="btns"><button class="btn ghost" data-a="new" data-col="meters" data-p='${fp}'>+ Добавить счётчик</button></div>`;
    o+=`<p class="hint">«Последний контроль» — когда вы сверяли счётчик с квитанцией. Он обновляется кнопкой «Проверил сегодня» и при вводе показаний.</p>`;
    return o;
  }
  /* --- общая информация: дом, УК, аварийные службы --- */
  if(ft==='info'){
    o+=`<div class="btns" style="margin-top:0"><button class="btn" data-a="editinfo" data-id="${f.id}">Изменить общую информацию</button></div>`;
    const em=(f.emergency||[]).filter(x=>x.t||x.p);
    if(em.length)o+=`<div class="gt">Аварийные службы</div><div class="grp">${em.map(x=>x.p?`<a class="row" href="tel:${esc(telHref(x.p))}"><div class="t"><b>${esc(x.t||'Телефон')}</b></div><div class="v"><b style="color:var(--acc)">${esc(x.p)}</b></div></a>`:`<div class="row"><div class="t"><b>${esc(x.t)}</b></div><div class="v mute">не указан</div></div>`).join('')}</div>`;
    const uk=[['Название',f.uk],['Телефон',f.ukPhone,'tel'],['Диспетчерская',f.ukDisp,'tel'],['Почта',f.ukEmail,'mail'],['Сайт, кабинет',f.ukSite,'url']].filter(x=>x[1]);
    if(uk.length)o+=`<div class="gt">Управляющая компания</div><div class="grp">${uk.map(kvRow).join('')}</div>`;
    const inf=[['Адрес',f.address],['Код домофона',f.intercom],['Краны и щиток',f.shutoff],['Парковка',f.parking],['Председатель совета дома',f.chairman],['Телефон председателя',f.chairmanPhone,'tel'],['Год постройки',f.year],['Этажей',f.floors]].filter(x=>x[1]);
    if(inf.length)o+=`<div class="gt">О доме</div><div class="grp">${inf.map(kvRow).join('')}</div>`;
    if(f.houseNotes)o+=`<div class="gt">Заметки о доме</div><div class="grp"><div class="note">${esc(f.houseNotes)}</div></div>`;
    if(!em.length&&!uk.length&&inf.length<2&&!f.houseNotes)o+=`<p class="hint">Сюда можно записать аварийные телефоны, данные управляющей компании, код домофона и где перекрывать воду.</p>`;
    return o;
  }
  /* --- дополнительно: статистика и история --- */
  const y=t.slice(0,4),cids=new Set(all.map(c=>c.id));
  const pays=db.payments.filter(p=>cids.has(p.contract)&&isIncome(p));
  const incY=pays.filter(p=>p.date.startsWith(y)).reduce((a,p)=>a+(+p.amount||0),0),incAll=pays.reduce((a,p)=>a+(+p.amount||0),0);
  const ex=db.expenses.filter(e=>e.flat===f.id).sort(byDate).reverse();
  const exY=ex.filter(e=>e.date&&e.date.startsWith(y)).reduce((a,e)=>a+(+e.amount||0),0);
  const debtAll=all.reduce((a,c)=>a+Math.max(0,ci(c).bal),0);
  const first=all.map(c=>c.dateStart).filter(Boolean).sort()[0];
  o+=`<div class="stat"><div><small>Получено за ${y}</small><b class="pos">${fM(incY)}</b></div><div><small>Расходы за ${y}</small><b class="${exY?'neg':''}">${fM(exY)}</b></div>
    <div><small>Чистыми за ${y}</small><b>${fM(incY-exY)}</b></div><div><small>Долг по всем договорам</small><b class="${debtAll>0?'neg':''}">${fM(debtAll)}</b></div>
    <div><small>Получено всего</small><b>${fM(incAll)}</b></div><div><small>Сдаётся с</small><b>${first?fD(first):'—'}</b></div></div>`;
  const years=[...new Set(db.charges.filter(x=>cids.has(x.contract)&&!x.void).map(x=>x.date.slice(0,4)))].sort().reverse();
  if(years.length)o+=`<div class="gt">Оплаты по годам</div><div class="grp">${years.map(yy=>`<div class="cstrip"><div class="top"><b>${yy}</b></div>${strip(k=>flatMonth(f,k),+yy)}</div>`).join('')}</div>${legend()}`;
  const sorted=[...all].sort((a,b)=>(b.dateStart||'').localeCompare(a.dateStart||''));
  o+=`<div class="gt">Договоры<span>${all.length}</span></div><div class="grp">${sorted.map(c=>{const i=ci(c),tn=G('tenants',c.tenant)||{};
    return`<button class="row tap" data-a="go" data-v="contract" data-id="${c.id}"><div class="t"><b>${esc(tn.fio||'Арендатор')}</b><small>${fD(c.dateStart)} — ${isActive(c)?(c.dateEnd?fD(c.dateEnd):'по настоящее время'):fD(c.closeDate)}${c.num?' · № '+esc(c.num):''} · оплачено ${fM(i.paid)}</small></div><div class="v">${isActive(c)?'<span class="chip acc">действует</span>':i.bal>0.004?`<span class="chip debt">долг ${fM(i.bal)}</span>`:'<span class="chip">завершён</span>'}</div></button>`}).join('')}
    <button class="row" data-a="new" data-col="contracts" data-p='${fp}'><div class="t"><b style="color:var(--acc)">+ Новый договор</b></div></button></div>`;
  o+=`<div class="gt">Расходы<span>за ${y} год: ${fM(exY)}</span></div><div class="grp">${ex.slice(0,10).map(expRow).join('')}
    <button class="row" data-a="new" data-col="expenses" data-p='${fp}'><div class="t"><b style="color:var(--acc)">+ Добавить расход</b></div></button></div>`;
  return o;
};
const fmtNum=n=>n==null||n===''?'':(+n).toLocaleString('ru-RU',{maximumFractionDigits:3});
function expRow(e){return`<button class="row tap" data-a="edit" data-col="expenses" data-id="${e.id}"><div class="t"><b>${esc(e.cat||'Расход')}</b><small>${fD(e.date)}${e.note?' · '+esc(e.note):''}</small></div><div class="v neg">−${fM(e.amount)}</div></button>`}

/* --- договор --- */
P.contract=r=>{
  const c=G('contracts',r.id),i=ci(c),t=today(),tn=G('tenants',c.tenant)||{},f=G('flats',c.flat);
  let o=hd(`Договор${c.num?' № '+c.num:''}`,`${c.dateStart?'от '+fD(c.dateStart)+' · ':''}${esc(flatLabel(f))}<br>${esc(tn.fio||'')}`,editBtn('contracts',c.id));
  const big=i.bal>0.004?`<div class="lbl">${i.overdue>0?'Долг':'К оплате'}</div><div class="big neg">${fM(i.bal)}</div>`:i.bal<-0.004?`<div class="lbl">Аванс, оплачено вперёд</div><div class="big pos">${fM(-i.bal)}</div>`:`<div class="lbl">Расчёты</div><div class="big pos">Долга нет</div>`;
  o+=`<section class="bal">${!isActive(c)?`<span class="chip" style="margin-bottom:8px">завершён ${fD(c.closeDate)}</span>`:''}${big}
    <div class="meta"><span>Аренда <b>${fM(rateAt(c,t))}</b></span>${i.next?`<span>Следующий платёж <b>${fDl(i.next)}</b></span>`:''}
    ${c.utilMode&&c.utilMode!=='tenant'?`<span>ЖКУ <b>${c.utilMode==='fixed'?fM(c.utilFixed):esc(UTIL[c.utilMode].toLowerCase())}</b></span>`:''}
    ${i.depCharged||i.depGot?`<span>Залог <b>${fM(i.depHeld)}</b>${i.depDue>0?` <span class="neg">(не внесено ${fM(i.depDue)})</span>`:''}</span>`:''}
    ${c.dateEnd?`<span>До <b>${fD(c.dateEnd)}</b>${c.auto?' с автопродлением':''}</span>`:''}</div>
    ${i.overdue>0&&i.oldest?`<div class="meta"><span>Самая старая просрочка — с ${fD(i.oldest)}, ${days(diffD(i.oldest,t))}</span></div>`:''}
    ${i.pen>0&&i.penCalc>0?`<div class="meta"><span>Пени ${i.pen}% в день: рассчитано <b>${fM(i.penCalc)}</b>, начислено <b>${fM(i.penCharged)}</b></span></div>`:''}
    ${strip(k=>cMonth(c,k))}</section>`;
  const pp=JSON.stringify({contract:c.id});
  o+=`<div class="btns"><button class="btn" data-a="new" data-col="payments" data-p='${esc(pp)}'>Внести оплату</button>
    <button class="btn ghost" data-a="new" data-col="charges" data-p='${esc(pp)}'>Начислить</button></div>`;
  o+=`<div class="grp">
    <button class="row tap" data-a="remind" data-id="${c.id}"><div class="t"><b>Напомнить об оплате</b><small>Сообщение арендатору по шаблону</small></div></button>
    ${c.utilMode==='meters'?`<button class="row tap" data-a="go" data-v="util" data-id="${c.id}"><div class="t"><b>Начислить ЖКУ по счётчикам</b><small>По последним показаниям и тарифам</small></div></button>`:''}
    ${i.pen>0&&i.penCalc-i.penCharged>=1?`<button class="row tap" data-a="penalty" data-id="${c.id}"><div class="t"><b>Начислить пени ${fM(i.penCalc-i.penCharged)}</b><small>Разница между рассчитанными и уже начисленными</small></div></button>`:''}
    <button class="row tap" data-a="doc" data-k="act" data-id="${c.id}"><div class="t"><b>Акт сверки</b><small>Все начисления и оплаты с итогом</small></div></button>
    <button class="row tap" data-a="doc" data-k="handover" data-id="${c.id}"><div class="t"><b>Акт приёма-передачи</b><small>Опись, ключи и показания счётчиков</small></div></button>
    <button class="row tap" data-a="go" data-v="tenant" data-id="${c.tenant}"><div class="t"><b>Карточка арендатора</b><small>${esc(tn.phone||'')}</small></div></button>
    ${isActive(c)?`<button class="row tap" data-a="go" data-v="close" data-id="${c.id}"><div class="t"><b>Выселить</b><small>Закрыть договор, расчёт по залогу</small></div></button>`:`<button class="row tap" data-a="reopen" data-id="${c.id}"><div class="t"><b>Возобновить договор</b></div></button>`}
  </div>`;
  /* лента операций */
  const items=[...i.ch.map(x=>({t:'c',x})),...i.pays.map(x=>({t:'p',x}))].sort((a,b)=>a.x.date<b.x.date?1:a.x.date>b.x.date?-1:a.t==='p'?-1:1);
  o+=`<div class="gt">Начисления и оплаты<span>начислено ${fM(i.charged)}, оплачено ${fM(i.paid)}</span></div><div class="grp">`;
  o+=items.length?items.map(it=>it.t==='c'?chargeRow(it.x,i):payRow(it.x,false)).join(''):`<div class="row"><div class="t"><small>Операций пока нет. Начисления аренды появятся сами в день платежа.</small></div></div>`;
  o+=`</div>`;
  if(c.notes)o+=`<div class="gt">Заметки</div><div class="grp"><div class="note">${esc(c.notes)}</div></div>`;
  return o;
};
function chargeRow(x,i){
  let chip='';
  if(x.kind!=='deposit'&&i){const st=i.al.get(x.id);
    if(st){chip=st.paid>=r2(x.amount)-0.004?'<span class="chip paid">оплачено</span>':addD(x.date,i.grace)<today()?(st.paid>0?`<span class="chip debt">осталось ${fM(r2(x.amount-st.paid))}</span>`:'<span class="chip debt">не оплачено</span>'):'<span class="chip soon">ждём</span>'}}
  const title=x.kind==='rent'?`Аренда за ${MON[+x.date.slice(5,7)-1]} ${x.date.slice(0,4)}`:x.kind==='util'&&x.auto?`ЖКУ за ${MON[+x.date.slice(5,7)-1]}`:(CH_KIND[x.kind]||'Начисление');
  return`<button class="row tap" data-a="edit" data-col="charges" data-id="${x.id}"><div class="t"><b>${esc(title)}</b><small>${fD(x.date)}${x.note?' · '+esc(x.note):''}</small></div><div class="v">${fM(x.amount)}<small>${chip}</small></div></button>`;
}
function payRow(p,withContract){
  const c=G('contracts',p.contract);const sign=p.kind==='refund'?'−':'+';
  const rc=db.cfg.tax==='npd'&&isIncome(p)?(p.receipt?' · чек выбит':' · <span class="neg">чек не выбит</span>'):'';
  return`<button class="row tap" data-a="edit" data-col="payments" data-id="${p.id}"><div class="t"><b>${esc(PAY_KIND[p.kind]||'Оплата')}${withContract&&c?' · '+esc(cLabel(c)):''}</b><small>${fD(p.date)} · ${esc(PAY_METHOD[p.method]||'')}${rc}${p.note?' · '+esc(p.note):''}</small></div><div class="v ${p.kind==='refund'?'neg':'pos'}">${sign}${fM(p.amount)}</div></button>`;
}

P.close=r=>{
  const c=G('contracts',r.id),i=ci(c);
  if(!r.draft)r.draft={closeDate:today(),closeReason:''};
  return hd('Выселение',esc(cLabel(c)))+`<div class="form" id="form">
    ${fieldHTML({k:'closeDate',l:'Дата выезда',t:'date'},r.draft.closeDate,'closeDate')}
    ${fieldHTML({k:'closeReason',l:'Причина, комментарий',t:'area'},r.draft.closeReason,'closeReason')}</div>
    <p class="hint">Начисления после даты выезда отменятся сами. Сейчас: ${i.bal>0.004?`долг <b>${fM(i.bal)}</b>`:i.bal<-0.004?`аванс <b>${fM(-i.bal)}</b> — его нужно вернуть или учесть`:'долга нет'}${i.depHeld>0?`, залог на руках <b>${fM(i.depHeld)}</b>`:''}.</p>
    ${i.depHeld>0?`<p class="hint">После завершения внесите операцию по залогу: «Залог возвращён» или «Зачёт залога в оплату», если удерживаете его в счёт долга.</p>`:''}
    <div class="btns"><button class="btn" data-a="doclose" data-id="${c.id}">Выселить</button></div>
    <p class="hint">Договор закроется. Если в квартире больше никто не живёт, она станет свободной.</p>`;
};

/* --- коммуналка по счётчикам --- */
const usage=x=>{const a=numv(x.from),b=numv(x.to);return a==null||b==null?null:Math.max(0,b-a)};
P.util=r=>{
  const c=G('contracts',r.id),f=G('flats',c.flat);
  const ms=db.meters.filter(m=>m.flat===c.flat&&!m.off);
  if(!r.draft){r.draft={date:today(),extra:'',extraNote:'',rows:{}};
    ms.forEach(m=>{const rs=readingsOf(m.id);const last=rs[0],prev=rs[1];
      r.draft.rows[m.id]={from:prev?prev.value:(m.initial??''),to:last?last.value:'',tariff:m.tariff??''}})}
  const d=r.draft;let total=0;
  const rowsH=ms.map(m=>{const x=d.rows[m.id]||{};const q=usage(x),s=r2((q||0)*(numv(x.tariff)||0));total+=s;
    return`<div class="fsec">${esc(m.type)}${m.serial?` <span class="mute" style="font-weight:400">№ ${esc(m.serial)}</span>`:''}</div>
    <label class="fld half"><span>Было</span><input name="rows.${m.id}.from" inputmode="decimal" value="${esc(x.from)}"></label>
    <label class="fld half"><span>Стало</span><input name="rows.${m.id}.to" inputmode="decimal" value="${esc(x.to)}"></label>
    <label class="fld half"><span>Тариф, ₽</span><input name="rows.${m.id}.tariff" inputmode="decimal" value="${esc(x.tariff)}"></label>
    <div class="fld half"><span>Сумма</span><div style="padding:11px 0;font-weight:650" class="num">${q==null?'<span class="mute" style="font-weight:400">заполните «было» и «стало»</span>':`${fmtNum(q)} ${esc(m.unit||'')} → ${fM(s)}`}</div></div>`}).join('');
  total+=numv(d.extra)||0;
  return hd('ЖКУ по счётчикам',esc(cLabel(c)))+(ms.length?'':`<p class="hint">В этом объекте нет счётчиков. Добавьте их в карточке объекта или введите сумму вручную ниже.</p>`)
    +`<div class="form" id="form">${rowsH}
    <div class="fsec">Прочее</div>
    <label class="fld half"><span>Фикс. платежи, ₽</span><input name="extra" inputmode="decimal" value="${esc(d.extra)}" placeholder="0"></label>
    <label class="fld half"><span>Что входит</span><input name="extraNote" value="${esc(d.extraNote)}" placeholder="Содержание, вывоз ТКО"></label>
    <label class="fld"><span>Дата начисления</span><input type="date" name="date" value="${esc(d.date)}"></label></div>
    <div class="btns"><button class="btn" data-a="doutil" data-id="${c.id}">Начислить ${fM(total)}</button></div>`;
};

/* --- показания --- */
P.readings=r=>{
  const f=G('flats',r.flat);const ms=db.meters.filter(m=>m.flat===r.flat&&!m.off);
  if(!r.draft){r.draft={date:today(),v:{}}}
  return hd('Показания',esc(flatLabel(f)))+`<div class="form" id="form">

/* --- оплаты --- */
P.ops=r=>{
  const m=r.m||ym(today()),fl=r.f||'all';
  const pays=db.payments.filter(p=>ym(p.date)===m),chs=db.charges.filter(x=>!x.void&&ym(x.date)===m&&G('contracts',x.contract)),exs=db.expenses.filter(e=>ym(e.date)===m);
  const got=pays.filter(isIncome).reduce((s,p)=>s+(+p.amount||0),0),chg=chs.filter(x=>x.kind!=='deposit').reduce((s,x)=>s+(+x.amount||0),0),exp=exs.reduce((s,e)=>s+(+e.amount||0),0);
  let items=[];
  if(fl==='all'||fl==='pay')items.push(...pays.map(x=>({t:'p',x})));
  if(fl==='all'||fl==='chg')items.push(...chs.map(x=>({t:'c',x})));
  if(fl==='all'||fl==='exp')items.push(...exs.map(x=>({t:'e',x})));
  items.sort((a,b)=>a.x.date<b.x.date?1:a.x.date>b.x.date?-1:0);
  let o=hd('Оплаты','',syncChip());
  o+=`<div class="mon"><button class="ib" data-a="mon" data-d="-1" aria-label="Предыдущий месяц">${svg('left')}</button><b>${fYM(m)}</b><button class="ib" data-a="mon" data-d="1" aria-label="Следующий месяц">${svg('right')}</button></div>`;
  o+=`<section class="ledger"><div class="lg3" style="margin-top:0"><div><small>Получено</small><b class="pos">${fM(got)}</b></div><div><small>Начислено</small><b>${fM(chg)}</b></div><div><small>Расходы</small><b class="${exp?'neg':''}">${fM(exp)}</b></div></div></section>`;
  o+=`<div class="btns"><button class="btn" data-a="new" data-col="payments">Оплата</button><button class="btn ghost" data-a="new" data-col="charges">Начисление</button><button class="btn ghost" data-a="new" data-col="expenses">Расход</button></div>`;
  o+=`<div class="seg">${[['all','Все'],['pay','Оплаты'],['chg','Начисления'],['exp','Расходы']].map(([k,l])=>`<button class="${fl===k?'on':''}" data-a="filt" data-f="${k}">${l}</button>`).join('')}</div>`;
  if(!items.length)return o+`<div class="empty">В ${MONP[+m.slice(5)-1]} операций нет</div>`;
  let lastD='';o+='';
  for(const it of items){
    if(it.x.date!==lastD){if(lastD)o+='</div>';lastD=it.x.date;o+=`<div class="gt">${cap(fDl(lastD))}</div><div class="grp">`}
    if(it.t==='p')o+=payRow(it.x,true);
    else if(it.t==='e')o+=expRow(it.x).replace('</small>',` · ${esc(flatLabel(G('flats',it.x.flat)))}</small>`);
    else{const c=G('contracts',it.x.contract);o+=chargeRow(it.x,ci(c)).replace('</b>',`</b><small>${esc(cLabel(c))}</small>`)}
  }
  return o+'</div>';
};

  const list=db.tenants.filter(t=>!q||(String(t.fio)+' '+t.phone+' '+digits(t.phone)).toLowerCase().includes(q)).map(t=>{
    const cs=db.contracts.filter(c=>c.tenant===t.id),act=cs.filter(isActive);
    const bal=cs.reduce((s,c)=>s+ci(c).bal,0),od=cs.reduce((s,c)=>s+ci(c).overdue,0);
    return{t,act,bal,od,cs}}).sort((a,b)=>(b.act.length?1:0)-(a.act.length?1:0)||String(a.t.fio).localeCompare(String(b.t.fio),'ru'));
  const row=x=>`<button class="row tap" data-a="go" data-v="tenant" data-id="${x.t.id}"><div class="t"><b>${esc(x.t.fio||'Без имени')}</b><small>${esc(x.act.map(c=>flatLabel(G('flats',c.flat))).join(', ')||(x.cs.length?'Выехал':'Без договора'))}</small></div><div class="v">${x.od>0?`<span class="chip debt">долг ${fM(x.od)}</span>`:x.bal>0.004?`<span class="chip soon">${fM(x.bal)}</span>`:''}</div></button>`;

}

P.reports=r=>{
  const y=r.y||+today().slice(0,4),fl=r.flat||'';
  const inFlat=cid=>!fl||(G('contracts',cid)||{}).flat===fl;
  const rows=Array.from({length:12},(_,k)=>{const m=`${y}-${pad(k+1)}`;
    const ps=db.payments.filter(p=>isIncome(p)&&ym(p.date)===m&&inFlat(p.contract));
    const inc=ps.reduce((s,p)=>s+(+p.amount||0),0);
    const tax=ps.reduce((s,p)=>s+(+p.amount||0)*taxRate(G('contracts',p.contract)),0);
    const exp=db.expenses.filter(e=>ym(e.date)===m&&(!fl||e.flat===fl)).reduce((s,e)=>s+(+e.amount||0),0);
    return{m,inc,exp,tax:r2(tax),net:inc-exp-r2(tax)}});
  const tot=rows.reduce((s,x)=>({inc:s.inc+x.inc,exp:s.exp+x.exp,tax:s.tax+x.tax,net:s.net+x.net}),{inc:0,exp:0,tax:0,net:0});
  const mx=Math.max(1,...rows.map(x=>Math.max(x.inc,x.exp)));
  const showTax=db.cfg.tax!=='none';
  let o=hd('Отчёты');
  o+=`<div class="mon"><button class="ib" data-a="year" data-d="-1" aria-label="Предыдущий год">${svg('left')}</button><b>${y} год</b><button class="ib" data-a="year" data-d="1" aria-label="Следующий год">${svg('right')}</button></div>`;
  if(db.flats.length>1)o+=`<select data-in="flat" style="margin:0 0 12px"><option value="">Все объекты</option>${db.flats.map(f=>`<option value="${f.id}"${f.id===fl?' selected':''}>${esc(flatLabel(f))}</option>`).join('')}</select>`;
  o+=`<section class="ledger"><div class="lg3" style="margin-top:0"><div><small>Получено</small><b class="pos">${fM(tot.inc)}</b></div><div><small>Расходы${showTax?' и налог':''}</small><b class="neg">${fM(tot.exp+tot.tax)}</b></div><div><small>Чистыми</small><b>${fM(tot.net)}</b></div></div></section>`;
  o+=`<div class="grp" style="margin-top:8px"><div class="bars" role="img" aria-label="Доходы и расходы по месяцам">${rows.map(x=>`<div><i style="height:${x.inc/mx*100}%"></i><i class="e" style="height:${x.exp/mx*100}%"></i></div>`).join('')}</div>
    <div class="bars lb">${rows.map((x,k)=>`<span>${MON1[k]}</span>`).join('')}</div>
    <div class="legend" style="margin:0 14px 12px"><span><i style="background:var(--paid)"></i>получено</span><span><i style="background:var(--debt);opacity:.75"></i>расходы</span></div></div>`;
  const fI=n=>Math.round(n).toLocaleString('ru-RU');
  o+=`<div class="grp tbl" style="margin-top:8px"><table class="rep"><tr><th>₽</th><th>Получено</th><th>Расходы</th>${showTax?'<th>Налог</th>':''}<th>Чистыми</th></tr>
    ${rows.map(x=>`<tr><td>${cap(MON[+x.m.slice(5)-1]).slice(0,3)}</td><td>${x.inc?fI(x.inc):'—'}</td><td>${x.exp?fI(x.exp):'—'}</td>${showTax?`<td>${x.tax?fI(x.tax):'—'}</td>`:''}<td>${x.inc||x.exp?fI(x.net):'—'}</td></tr>`).join('')}
    <tr class="tot"><td>Итого</td><td>${fI(tot.inc)}</td><td>${fI(tot.exp)}</td>${showTax?`<td>${fI(tot.tax)}</td>`:''}<td>${fI(tot.net)}</td></tr></table></div>`;
  if(showTax)o+=`<p class="hint" style="margin-top:8px">Налог посчитан по ставке из параметров учёта (${db.cfg.tax==='npd'?'НПД '+cfgN(db.cfg.npdPerson,4)+'% с физлиц, '+cfgN(db.cfg.npdCompany,6)+'% с юрлиц':'НДФЛ '+cfgN(db.cfg.ndfl,13)+'%'}) от полученных оплат. Это оценка, точную сумму смотрите в приложении налоговой.</p>`;
  const exCat={};db.expenses.filter(e=>e.date&&e.date.startsWith(String(y))&&(!fl||e.flat===fl)).forEach(e=>{exCat[e.cat||'Прочее']=(exCat[e.cat||'Прочее']||0)+(+e.amount||0)});
  const ec=Object.entries(exCat).sort((a,b)=>b[1]-a[1]);
  if(ec.length)o+=`<div class="gt">Расходы по категориям</div><div class="grp">${ec.map(([k,v])=>`<div class="row"><div class="t"><b>${esc(k)}</b></div><div class="v">${fM(v)}</div></div>`).join('')}</div>`;
  const debt=db.contracts.map(c=>({c,i:ci(c)})).filter(x=>x.i.bal>0.004&&(!fl||x.c.flat===fl)).sort((a,b)=>b.i.bal-a.i.bal);
  o+=`<div class="gt">Должники<span>${fM(debt.reduce((s,x)=>s+x.i.bal,0))}</span></div><div class="grp">${debt.length?debt.map(x=>`<button class="row tap" data-a="go" data-v="contract" data-id="${x.c.id}"><div class="t"><b>${esc(cLabel(x.c))}</b><small>${x.i.oldest?'с '+fD(x.i.oldest):'срок оплаты не наступил'}${isActive(x.c)?'':', договор завершён'}</small></div><div class="v neg">${fM(x.i.bal)}</div></button>`).join(''):'<div class="row"><div class="t"><small>Долгов нет</small></div></div>'}</div>`;
  const dep=db.contracts.map(c=>({c,i:ci(c)})).filter(x=>x.i.depHeld>0.004&&(!fl||x.c.flat===fl));
  if(dep.length)o+=`<div class="gt">Залоги на руках<span>${fM(dep.reduce((s,x)=>s+x.i.depHeld,0))}</span></div><div class="grp">${dep.map(x=>`<button class="row tap" data-a="go" data-v="contract" data-id="${x.c.id}"><div class="t"><b>${esc(cLabel(x.c))}</b>${isActive(x.c)?'':'<small class="neg">договор завершён, залог не возвращён</small>'}</div><div class="v">${fM(x.i.depHeld)}</div></button>`).join('')}</div>`;
  o+=`<div class="btns"><button class="btn ghost" data-a="csv" data-y="${y}">Выгрузить ${y} год в CSV</button></div>`;
  return o;
};

function collect(def,d){
  const out={};
  for(const f of def.fields){
    if(!f.k)continue;
    if(f.show&&!f.show(d)){continue}
    let v=d[f.k];
    if(f.t==='money'||f.t==='num'){v=numv(v);if(f.t==='money'&&v!=null)v=r2(v)}
    else if(f.t==='check')v=v?1:0;
    else if(f.t==='rows'){v=(Array.isArray(v)?v:[]).map(rw=>{const o={};f.sub.forEach(s=>{let x=rw[s.k];if(s.t==='money'||s.t==='num')x=numv(x);else x=String(x??'').trim();o[s.k]=x});return o}).filter(o=>Object.values(o).some(x=>x!==''&&x!=null))}
    else if(typeof v==='string')v=v.trim();
    if(f.req&&(v==null||v===''))return{err:`Заполните поле «${f.l}»`};
    out[f.k]=v;
  }
  return{out};
}
function doSave(){

  if(r.col==='flats'&&!r.def){

    else if(!r.id)out.emergency=clone(db.cfg.emergency||[]);
    delete out._copy;
  }
  const ex=r.id?G(r.col,r.id):null;

  if(r.col==='charges'&&ex&&ex.auto)obj.edited=1;
  if(r.col==='contracts'&&!ex)obj.status='active';
  if(r.col==='payments'&&obj.receipt&&!(ex&&ex.receipt))obj.receiptAt=Date.now();
  put(r.col,obj);

  const prev=stack[stack.length-2];
  if(r.ret&&prev&&prev.draft){prev.draft[r.ret]=obj.id;if(F[prev.col]&&F[prev.col].onChange)F[prev.col].onChange(prev.draft,r.ret)}
  if(!ex&&r.open){stack.pop();go({v:r.open,id:obj.id});toast('Сохранено');return}
  back();
  if(r.col==='payments'&&!ex&&db.cfg.tax==='npd'&&isIncome(obj)&&!obj.receipt)toast(`Сохранено. Не забудьте выбить чек на ${fM(obj.amount)}`);
  else toast('Сохранено');
}

function deps(col,id){
  const d=[];
  if(col==='houses')db.flats.filter(x=>x.house===id).forEach(x=>d.push(['flats',x.id],...deps('flats',x.id)));
  if(col==='flats'){db.meters.filter(x=>x.flat===id).forEach(x=>d.push(['meters',x.id],...deps('meters',x.id)));db.contracts.filter(x=>x.flat===id).forEach(x=>d.push(['contracts',x.id],...deps('contracts',x.id)));db.expenses.filter(x=>x.flat===id).forEach(x=>d.push(['expenses',x.id]))}
  if(col==='meters')db.readings.filter(x=>x.meter===id).forEach(x=>d.push(['readings',x.id]));
  if(col==='contracts'){db.charges.filter(x=>x.contract===id).forEach(x=>d.push(['charges',x.id]));db.payments.filter(x=>x.contract===id).forEach(x=>d.push(['payments',x.id]))}
  return d;
}
function doDelete(){
  const r=cur(),col=r.col,id=r.id,rec=G(col,id);if(!rec)return;
  if(col==='tenants'&&db.contracts.some(c=>c.tenant===id)){toast('У арендатора есть договоры. Сначала удалите их.');return}
  if(col==='charges'&&rec.auto){
    if(!confirm('Отменить это начисление? Оно не появится снова.'))return;
    Object.assign(rec,{void:1,voidAuto:0,edited:1,upd:Date.now()});save();back();toast('Начисление отменено');return;
  }
  const dp=deps(col,id);
  const names={flats:'объектов',meters:'счётчиков',readings:'показаний',contracts:'договоров',charges:'начислений',payments:'оплат',expenses:'расходов'};
  const cnt={};dp.forEach(([c])=>cnt[c]=(cnt[c]||0)+1);
  const msg=dp.length?`Удалить вместе со связанными данными: ${Object.entries(cnt).map(([c,n])=>n+' '+names[c]).join(', ')}? Это нельзя отменить.`:'Удалить запись? Это нельзя отменить.';
  if(!confirm(msg))return;
  dp.forEach(([c,i])=>del(c,i));del(col,id);
  db.tasks.forEach(t=>{if(t.flat&&!G('flats',t.flat)){t.flat='';t.upd=Date.now()}});
  save();
  stack.pop();
  while(stack.length>1&&!routeOk(cur()))stack.pop();
  render('restore');toast('Удалено');
}
function routeOk(r){

function rub(n){
  n=Math.floor(Math.abs(+n||0));const kop=Math.round((Math.abs(+arguments[0]||0)-n)*100);
  const o=['','один','два','три','четыре','пять','шесть','семь','восемь','девять'],of=['','одна','две'],
    t=['десять','одиннадцать','двенадцать','тринадцать','четырнадцать','пятнадцать','шестнадцать','семнадцать','восемнадцать','девятнадцать'],
    d=['','','двадцать','тридцать','сорок','пятьдесят','шестьдесят','семьдесят','восемьдесят','девяносто'],
    h=['','сто','двести','триста','четыреста','пятьсот','шестьсот','семьсот','восемьсот','девятьсот'];
  const tri=(x,fem)=>{const a=[];a.push(h[Math.floor(x/100)]);const r=x%100;if(r>=10&&r<20)a.push(t[r-10]);else{a.push(d[Math.floor(r/10)]);const u=r%10;a.push(fem&&u<3?of[u]||o[u]:o[u])}return a.filter(Boolean).join(' ')};
  if(n===0)return'ноль рублей';
  const parts=[],groups=[[1e9,['миллиард','миллиарда','миллиардов'],0],[1e6,['миллион','миллиона','миллионов'],0],[1e3,['тысяча','тысячи','тысяч'],1]];
  let x=n;for(const[g,w,fem]of groups){const q=Math.floor(x/g);if(q){parts.push(tri(q,fem),plural(q,...w));x%=g}}
  if(x)parts.push(tri(x,0));
  return parts.join(' ')+' '+plural(n,'рубль','рубля','рублей')+(kop?` ${pad(kop)} ${plural(kop,'копейка','копейки','копеек')}`:'');
}

let syncing=false,syncTimer=null,dirtyAgain=false;
const syncReady=()=>!!(dev.sync&&dev.sync.repo&&dev.sync.token&&dev.sync.pass);
function markDirty(){
  if(!syncReady()||dev.sync.auto===false)return;
  if(syncing){dirtyAgain=true;return}
  clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncNow(false),5000);
}
const utf8=s=>new TextEncoder().encode(s),unutf8=u=>new TextDecoder().decode(u);
const b64e=u=>{let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
const b64d=s=>{const b=atob(String(s).replace(/\s/g,''));const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
async function viaStream(u,ts){return new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(ts)).arrayBuffer())}
let keyCache={};
async function getKey(pass,salt,iter){
  const id=pass+'|'+b64e(salt)+'|'+iter;if(keyCache[id])return keyCache[id];
  const base=await crypto.subtle.importKey('raw',utf8(pass),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  keyCache={[id]:k};return k;
}
async function seal(obj,pass,salt){
  let data=utf8(JSON.stringify(obj)),z=0;
  if(window.CompressionStream){data=await viaStream(data,new CompressionStream('gzip'));z=1}
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await getKey(pass,salt,ITER),data));
  return{app:'kvartiry',v:1,kdf:'PBKDF2-SHA256',iter:ITER,salt:b64e(salt),iv:b64e(iv),z,data:b64e(ct)};
}
async function unseal(env,pass){
  const key=await getKey(pass,b64d(env.salt),env.iter||ITER);let pt;
  try{pt=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(env.iv)},key,b64d(env.data)))}catch(e){throw new Error('pass')}
  if(env.z){if(!window.DecompressionStream)throw new Error('nogz');pt=await viaStream(pt,new DecompressionStream('gzip'))}
  return JSON.parse(unutf8(pt));
}
const ghUrl=s=>`https://api.github.com/repos/${s.repo}/contents/${(s.path||'kvartiry.enc.json').split('/').map(encodeURIComponent).join('/')}`;
const ghH=(s,acc)=>({Authorization:'Bearer '+s.token,Accept:acc||'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'});
async function ghGet(s){
  const q=s.branch?`?ref=${encodeURIComponent(s.branch)}`:'';
  const r=await fetch(ghUrl(s)+q,{headers:ghH(s),cache:'no-store'});
  if(r.status===404){
    const rr=await fetch(`https://api.github.com/repos/${s.repo}`,{headers:ghH(s),cache:'no-store'});
    if(rr.status===401)throw new Error('auth');if(!rr.ok)throw new Error('repo');
    return null;
  }
  if(r.status===401)throw new Error('auth');
  if(r.status===403)throw new Error('forbidden');
  if(!r.ok)throw new Error('http'+r.status);
  const j=await r.json();
  if(Array.isArray(j))throw new Error('format');
  let text;
  if(j.content&&j.encoding==='base64')text=unutf8(b64d(j.content));
  else{const r2=await fetch(ghUrl(s)+q,{headers:ghH(s,'application/vnd.github.raw+json'),cache:'no-store'});if(!r2.ok)throw new Error('http'+r2.status);text=await r2.text()}
  return{sha:j.sha,text};
}
async function ghPut(s,text,sha){
  const body={message:'Синхронизация «Мои квартиры»',content:b64e(utf8(text))};
  if(sha)body.sha=sha;if(s.branch)body.branch=s.branch;
  const r=await fetch(ghUrl(s),{method:'PUT',headers:{...ghH(s),'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(r.ok)return true;
  if(r.status===409||r.status===422)return false;
  if(r.status===401)throw new Error('auth');
  if(r.status===403||r.status===404)throw new Error('forbidden');
  throw new Error('http'+r.status);
}
function mergeDb(a,b){
  const out={schema:1,tomb:Object.assign({},b.tomb)};
  for(const[k,v]of Object.entries(a.tomb||{}))if(!out.tomb[k]||v>out.tomb[k])out.tomb[k]=v;
  out.cfg=(+(a.cfg&&a.cfg.upd)||0)>=(+(b.cfg&&b.cfg.upd)||0)?a.cfg:b.cfg;
  for(const c of COLS){
    const m=new Map();
    for(const r of[...(a[c]||[]),...(b[c]||[])]){const e=m.get(r.id);if(!e||(+r.upd||0)>(+e.upd||0))m.set(r.id,r)}
    out[c]=[...m.values()].filter(r=>!(out.tomb[r.id]&&out.tomb[r.id]>=(+r.upd||0)));
  }
  return normalize(out);
}
function canon(o){
  if(Array.isArray(o))return'['+o.map(canon).join(',')+']';
  if(o&&typeof o==='object')return'{'+Object.keys(o).filter(k=>o[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+canon(o[k])).join(',')+'}';
  return JSON.stringify(o);
}
function canonDb(d){const x=clone(d);COLS.forEach(c=>x[c].sort((p,q)=>p.id<q.id?-1:p.id>q.id?1:0));return canon(x)}
function syncErrText(e){
  const m=String(e&&e.message||e);
  return{auth:'GitHub не принял токен: проверьте, что он скопирован целиком и не истёк',
    repo:'Репозиторий не найден: проверьте имя в виде «логин/репозиторий» и что токену дан доступ к нему',
    forbidden:'Токену не хватает прав: нужен доступ Contents — Read and write к этому репозиторию',
    pass:'Не удалось расшифровать данные: фраза-пароль не совпадает с той, что задана на другом устройстве',
    format:'Файл в репозитории не похож на данные приложения: укажите другое имя файла',
    nogz:'Браузер устарел и не умеет распаковывать данные',
    conflict:'Данные одновременно менялись на другом устройстве. Повторите синхронизацию'}[m]
    ||(/fetch|network|load failed/i.test(m)?'Нет связи с GitHub':'Ошибка синхронизации: '+m);
}
async function syncNow(manual){
  if(!syncReady()){if(manual)go({v:'sync'});return}
  if(syncing)return;
  syncing=true;dirtyAgain=false;clearTimeout(syncTimer);syncTimer=null;refreshSync();
  const s=dev.sync;
  try{
    for(let attempt=0;;attempt++){
      const rem=await ghGet(s);
      let rdb=null,salt;
      if(rem){
        let env;try{env=JSON.parse(rem.text)}catch(e){throw new Error('format')}
        if(!env||env.app!=='kvartiry')throw new Error('format');
        salt=b64d(env.salt);rdb=normalize(await unseal(env,s.pass));
      }else salt=crypto.getRandomValues(new Uint8Array(16));
      if(rdb){db=mergeDb(db,rdb);inval()}
      migrateHouses();genCharges();
      save(true);
      if(rdb&&canonDb(db)===canonDb(rdb))break;
      const ok=await ghPut(s,JSON.stringify(await seal(db,s.pass,salt)),rem&&rem.sha);
      if(ok)break;
      if(attempt>=3)throw new Error('conflict');
    }
    dev.lastSync=Date.now();dev.syncErr='';
    if(manual)toast('Синхронизировано');
  }catch(e){dev.syncErr=syncErrText(e);if(manual)toast(dev.syncErr)}
  finally{
    syncing=false;saveDev();
    const r=cur(),busy=['edit','sync','readings','util','close','security'].includes(r.v)||!!r.qp||!!r.rp||document.activeElement&&document.activeElement.matches('input,textarea,select');
    if(busy)refreshSync();else render('keep');
    if(dirtyAgain){dirtyAgain=false;markDirty()}
  }
}
