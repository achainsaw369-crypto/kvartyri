  dues(c1,t).forEach((d,k,a)=>{if(k<a.length-1)put('payments',{contract:c1.id,date:addD(d,k%3),amount:38000,kind:'pay',method:'transfer',receipt:1})});
  put('payments',{contract:c2.id,date:s2,amount:30000,kind:'deposit',method:'cash'});
  dues(c2,t).forEach((d,k,a)=>{if(k<a.length-2)put('payments',{contract:c2.id,date:d,amount:33500,kind:'pay',method:'transfer',receipt:1});else if(k===a.length-2)put('payments',{contract:c2.id,date:addD(d,2),amount:20000,kind:'pay',method:'cash',receipt:0,note:'остаток обещал позже'})});
  [['Холодная вода','ХВ-11873',6,'м³',38.5],['Горячая вода','ГВ-55102',4,'м³',245.1],['Электроэнергия','Э-90011',16,'кВт·ч',8.39]].forEach(([type,serial,y,u,tar],k)=>{
    const m=put('meters',{flat:f1.id,type,serial,years:y,unit:u,tariff:tar,verifyDate:k===1?addM(t,-47):addM(t,-24)});
    put('readings',{meter:m.id,date:addM(t,-2),value:[112.1,76.0,15020][k]});
    put('readings',{meter:m.id,date:addM(t,-1),value:[120.4,80.2,15230][k]});
  });
  put('expenses',{flat:f1.id,date:addD(t,-20),amount:4200,cat:'Ремонт',note:'Замена смесителя'});
  put('tasks',{text:'Позвонить в УК насчёт протечки',date:addD(t,1)});
  save();toast('Пример заполнен: всё можно изменить или удалить');render('top');
}

/* ================= отрисовка ================= */
function render(mode){
  const app=$('#app'),r=cur();
  if(!routeOk(r)){while(stack.length>1&&!routeOk(cur()))stack.pop()}
  const keep=app.scrollTop;
  let html;try{html=(P[cur().v]||P.flats)(cur())}catch(e){console.error(e);html=hd('Ошибка')+`<div class="empty card"><p>Не удалось показать экран: ${esc(e.message)}</p><button class="btn" data-a="tab" data-t="flats">К списку квартир</button></div>`}
  app.innerHTML=html;
  app.scrollTop=mode==='top'?0:mode==='restore'?(cur().sc||0):keep;
  $('#nav').innerHTML=[['flats','Квартиры','obj'],['sum','Сводка','ops'],['more','Ещё','more']]
    .map(([k,l,ic])=>`<button class="tab${tab===k?' on':''}" data-tab="${k}">${svg(ic)}<span>${l}</span></button>`).join('');
}
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2800)}
function applyTheme(){
  const th=dev.theme||'auto',dark=th==='dark'||(th==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme=dark?'dark':'light';
  const m=$('meta[name="theme-color"]');if(m)m.content=dark?'#0F1418':'#E9EEF1';
  try{NP&&NP.SystemBars&&NP.SystemBars.setStyle({style:dark?'DARK':'LIGHT'})}catch(e){}
}
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',applyTheme);

/* ================= действия ================= */
const A={
  back:()=>back(),
  tab:d=>setTab(d.t),
  go:(d,el,e)=>{if(e)e.preventDefault();if(d.r){go(JSON.parse(d.r));return}const r={v:d.v};if(d.id)r.id=d.id;if(d.flat)r.flat=d.flat;go(r)},
  new:d=>{const r={v:'edit',col:d.col,p:d.p?JSON.parse(d.p):{}};if(['flats','tenants'].includes(d.col)&&!(d.col==='tenants'&&stack.length>1))r.open={flats:'flat',tenants:'tenant'}[d.col];go(r)},
  edit:d=>go({v:'edit',col:d.col,id:d.id}),
  save:()=>doSave(),
  ftab:d=>{const r=cur();r.ft=d.t;r.qp=null;r.rp=null;render('top')},
  editinfo:d=>go({v:'edit',col:'flats',def:'flatInfo',id:d.id}),
  rpopen:d=>{const r=cur(),c=G('contracts',d.id),i=ci(c);r.qp=null;r.rp={c:c.id,amount:String(rateAt(c,today())).replace('.',','),date:i.next||today()};render('keep');
    setTimeout(()=>{const el=$('[data-rp=amount]');if(el){el.focus();el.select()}},60)},
  rpcancel:()=>{cur().rp=null;render('keep')},
  rpsave:d=>{const r=cur(),q=r.rp,c=G('contracts',d.id);if(!q||!c)return;const a=numv(q.amount);
    if(!a||a<=0){toast('Введите новую сумму');return}
    if(!q.date){toast('Укажите дату, с которой действует сумма');return}
    if(c.dateStart&&q.date<c.dateStart){toast('Дата раньше начала договора');return}
    c.rates=(c.rates||[]).filter(x=>x.from!==q.date);c.rates.push({from:q.date,amount:r2(a)});c.rates.sort((x,y)=>x.from<y.from?-1:1);
    put('contracts',c);genCharges();save();r.rp=null;render('keep');
    toast(`С ${fD(q.date)} платёж ${fM(a)} каждое ${+q.date.slice(8)} число`)},
  checkone:d=>{const m=G('meters',d.id);m.lastCheck=today();put('meters',m);save();render('keep');toast('Отмечено: проверено сегодня')},
  checkall:d=>{db.meters.filter(m=>m.flat===d.id&&!m.off).forEach(m=>{m.lastCheck=today();put('meters',m)});save();render('keep');toast('Все счётчики отмечены проверенными сегодня')},
  advtoggle:()=>{const r=cur();r.draft._adv=!r.draft._adv;render('keep')},
  qpopen:d=>{const r=cur(),c=G('contracts',d.id),i=ci(c),pw=payWhen(i);
    const amt=i.bal>0.004?i.bal:pw&&!pw.ahead?pw.amt:rateAt(c,today());
    r.qp={c:c.id,amount:String(r2(amt)).replace('.',','),date:today(),method:'transfer',receipt:0};render('keep');
    setTimeout(()=>{const el=$('[data-qp=amount]');if(el){el.focus();el.select()}},60)},
  qpcancel:()=>{cur().qp=null;render('keep')},
  qpsave:d=>{const r=cur(),q=r.qp;if(!q)return;const a=numv(q.amount);
    if(!a||a<=0){toast('Введите сумму, которую заплатил арендатор');return}
    put('payments',{contract:d.id,date:q.date||today(),amount:r2(a),kind:'pay',method:q.method||'transfer',receipt:q.receipt?1:0,receiptAt:q.receipt?Date.now():undefined});
    save();r.qp=null;render('keep');
    const i=ci(G('contracts',d.id));
    toast(`Оплата ${fM(a)} сохранена. `+(i.bal>0.004?`Осталось ${fM(i.bal)}`:i.bal<-0.004?`Аванс ${fM(-i.bal)}`:'Долга нет')+(db.cfg.tax==='npd'&&!q.receipt?'. Не забудьте чек':''))},
  delrec:()=>doDelete(),
  newtenant:()=>go({v:'edit',col:'tenants',ret:'tenant'}),
  rowadd:d=>{const r=cur(),a=getPath(r.draft,d.k);const def=F[r.def||r.col].fields.find(f=>f.k===d.k);const o={};def.sub.forEach(s=>o[s.k]='');if(Array.isArray(a))a.push(o);else setPath(r.draft,d.k,[o]);render('keep');
    setTimeout(()=>{const ins=$$(`[name^="${d.k}.${getPath(r.draft,d.k).length-1}."]`);if(ins[0])ins[0].focus()},30)},
  rowdel:d=>{const r=cur(),a=getPath(r.draft,d.k);if(Array.isArray(a))a.splice(+d.i,1);render('keep')},
  mon:d=>{const r=cur();r.m=addYM(r.m||ym(today()),+d.d);render('keep')},
  year:d=>{const r=cur();r.y=(r.y||+today().slice(0,4))+(+d.d);render('keep')},
  filt:d=>{cur().f=d.f;render('keep')},
  pd:()=>{const r=cur();r.pd=!r.pd;render('keep')},
  unblur:(d,el)=>el.classList.toggle('secret'),
  copy:d=>{if(d.t)copyText(d.t)},
  remind:d=>{const c=G('contracts',d.id),i=ci(c),t=G('tenants',c.tenant)||{};
    go({v:'doc',title:i.overdue>0?'Сообщение о долге':'Напоминание',text:fillTpl(i.overdue>0?db.cfg.tplDebt:db.cfg.tplRemind,c),phone:t.phone})},
  thanks:d=>{const p=G('payments',d.id),c=G('contracts',p.contract),t=G('tenants',c.tenant)||{};go({v:'doc',title:'Оплату получил',text:fillTpl(db.cfg.tplThanks,c,{sum:p.amount}),phone:t.phone})},
  doc:d=>{
    if(d.k==='receipt'){const p=G('payments',d.id);go({v:'doc',title:'Расписка',text:docReceipt(p)});return}
    const c=G('contracts',d.id);
    go(d.k==='act'?{v:'doc',title:'Акт сверки',text:docAct(c)}:{v:'doc',title:'Акт приёма-передачи',text:docHandover(c)});
  },
  sharetext:()=>{const r=cur();shareText(r.text,r.title)},
  copytext:()=>copyText(cur().text),
  print:()=>{$('#print').textContent=cur().text;window.print()},
  penalty:d=>{const c=G('contracts',d.id),i=ci(c),a=r2(i.penCalc-i.penCharged);if(a<=0)return;
    if(!confirm(`Начислить пени ${fM(a)}?`))return;
    put('charges',{contract:c.id,date:today(),amount:a,kind:'penalty',note:`Пени ${i.pen}% в день`});save();render('keep');toast('Пени начислены')},
  doclose:d=>{const c=G('contracts',d.id),r=cur();const dt=r.draft.closeDate;if(!dt){toast('Укажите дату выезда');return}
    Object.assign(c,{status:'closed',closeDate:dt,closeReason:(r.draft.closeReason||'').trim()});put('contracts',c);genCharges();save();back();toast('Арендатор выселен')},
  reopen:d=>{const c=G('contracts',d.id);if(!confirm('Возобновить договор? Начисления снова пойдут по графику.'))return;c.status='active';c.closeDate='';put('contracts',c);genCharges();save();render('keep')},
  doutil:d=>{const c=G('contracts',d.id),r=cur(),dr=r.draft;let total=0;const parts=[];
    db.meters.filter(m=>m.flat===c.flat&&!m.off).forEach(m=>{const x=dr.rows[m.id]||{};const q=usage(x)||0,s=r2(q*(numv(x.tariff)||0));
      if(s>0){total+=s;parts.push(`${m.type}: ${fmtNum(q)} ${m.unit||''} × ${fmtNum(numv(x.tariff))}`)}
      const tv=numv(x.tariff);if(tv!=null&&tv!==m.tariff){m.tariff=tv;put('meters',m)}});
    const ex=numv(dr.extra)||0;if(ex>0){total+=ex;parts.push((dr.extraNote||'Фиксированные платежи')+': '+fmtNum(ex)+' ₽')}
    total=r2(total);if(total<=0){toast('Сумма к начислению — ноль');return}
    put('charges',{contract:c.id,date:dr.date||today(),amount:total,kind:'util',note:parts.join('; ')});save();back();toast(`Начислено ${fM(total)}`)},
  doreadings:d=>{const r=cur();let n=0;
    for(const[mid,v]of Object.entries(r.draft.v||{})){const x=numv(v);if(x==null)continue;const lr=lastReading(mid);
      if(lr&&x<+lr.value&&!confirm(`Показание ${fmtNum(x)} меньше прошлого (${fmtNum(lr.value)}). Всё равно сохранить?`))continue;
      put('readings',{meter:mid,date:r.draft.date||today(),value:x});n++}
    if(!n){toast('Введите хотя бы одно показание');return}
    save();back();toast(`Сохранено показаний: ${n}`)},
  taskdone:(d,el)=>{const k=G('tasks',d.id);if(!k)return;
    if(el.checked&&k.repeat){k.date=addM(k.date||today(),k.repeat==='y'?12:1);toast('Перенесено на '+fD(k.date))}else k.done=el.checked?1:0;
    put('tasks',k);save();setTimeout(()=>render('keep'),250)},
  rcpt:d=>{const p=G('payments',d.id);p.receipt=1;p.receiptAt=Date.now();put('payments',p);save();render('keep')},
  theme:d=>{dev.theme=d.t;saveDev();applyTheme();render('keep')},
  update:()=>checkUpdate(),
  apkdl:()=>{const u=apkNew();if(u)openExternal(u.url)},
  export:()=>exportData(),
  ics:()=>shareFile('kvartiry.ics',icsAll(),'text/calendar','Календарь «Мои квартиры»'),
  csv:d=>shareFile(`kvartiry-${d.y||'all'}.csv`,csvAll(d.y),'text/csv','Выгрузка «Мои квартиры»'),
  wipe:()=>{if(!confirm(syncReady()?'Удалить все данные на этом устройстве? Синхронизация включена: при следующем обмене данные вернутся из репозитория. Чтобы этого не было, сначала отключите её.':'Удалить все данные на этом устройстве?'))return;if(!confirm('Точно удалить? Без копии восстановить нельзя.'))return;
    db=emptyDb();save(true);dev.lastSync=0;saveDev();setTab('flats');toast('Данные удалены')},
  demo:()=>demo(),
  syncnow:()=>syncNow(true),
  syncsave:()=>{
    const repo=$('#s_repo').value.trim().replace(/^https?:\/\/github\.com\//i,'').replace(/\.git$/,'').replace(/\/+$/,'');
    const s={repo,token:$('#s_token').value.trim(),pass:$('#s_pass').value,branch:$('#s_branch').value.trim(),path:$('#s_path').value.trim(),auto:$('#s_auto').checked};
    if(!/^[\w.-]+\/[\w.-]+$/.test(s.repo)){toast('Репозиторий укажите в виде «логин/название»');return}
    if(!s.token){toast('Вставьте токен GitHub');return}
    if(s.pass.length<8){toast('Фраза-пароль — минимум 8 символов');return}
    dev.sync=s;dev.syncErr='';saveDev();syncNow(true);
  },
  syncoff:()=>{if(!confirm('Отключить синхронизацию на этом устройстве? Данные здесь и в репозитории останутся.'))return;dev.sync=null;dev.lastSync=0;dev.syncErr='';saveDev();render('keep')},
  pinset:async()=>{const a=$('#pin1').value,b=$('#pin2').value;
    if(!/^\d{4,6}$/.test(a)){toast('Код — от 4 до 6 цифр');return}if(a!==b){toast('Коды не совпадают');return}
    const salt=b64e(crypto.getRandomValues(new Uint8Array(12)));dev.pin={salt,hash:await sha(salt+a),len:a.length,min:+$('#pinmin').value};saveDev();toast('Код включён');back()},
  pinoff:()=>{if(!confirm('Выключить код-пароль?'))return;dev.pin=null;saveDev();render('keep')},
  pin:d=>pinKey(d.d),
  pinforgot:()=>{if(!confirm('Код можно сбросить только вместе с данными на этом устройстве. Если включена синхронизация, данные вернутся из репозитория после повторного подключения. Сбросить?'))return;
    if(!confirm('Удалить данные и код на этом устройстве?'))return;
    db=emptyDb();save(true);dev={theme:dev.theme};saveDev();$('#lock').classList.remove('on');setTab('flats')}
};
document.addEventListener('click',e=>{
  const tb=e.target.closest('[data-tab]');if(tb){setTab(tb.dataset.tab);return}
  const el=e.target.closest('[data-a]');if(!el)return;
  if(el.tagName==='INPUT'&&el.type==='checkbox'){A[el.dataset.a]&&A[el.dataset.a](el.dataset,el,e);return}
  if(el.tagName==='A'&&el.dataset.a!=='go')return;
  const f=A[el.dataset.a];if(f){e.preventDefault();f(el.dataset,el,e)}
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.qp){const r=cur();if(r.qp)r.qp[el.dataset.qp]=el.type==='checkbox'?el.checked:el.value;return}
  if(el.dataset.rp){const r=cur();if(r.rp)r.rp[el.dataset.rp]=el.value;return}
  if(el.dataset.in){const r=cur();r[el.dataset.in]=el.value;
    if(el.dataset.in==='q'){const L=$('#list');if(L)L.innerHTML=r.v==='flats'?flatList(r):tenList(r)}else render('keep');return}
  const form=el.closest('#form');if(!form||!el.name)return;
  const r=cur();if(!r.draft)return;
  setPath(r.draft,el.name,el.type==='checkbox'?el.checked:el.value);
  if(r.v==='util'&&el.type!=='date')scheduleUtilRefresh();
});
let utilT;function scheduleUtilRefresh(){clearTimeout(utilT);utilT=setTimeout(()=>{const fe=document.activeElement,nm=fe&&fe.name,pos=fe&&fe.selectionStart;render('keep');if(nm){const n=$(`[name="${nm}"]`);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}}},700)}
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='imp'){importFile(el.files[0]);el.value='';return}
  if(el.dataset.qp||el.dataset.rp)return;
  if(el.dataset.in&&el.tagName==='SELECT'){cur()[el.dataset.in]=el.value;render('keep');return}
  const form=el.closest('#form');if(!form||!el.name)return;
  const r=cur();if(!r.draft)return;
  setPath(r.draft,el.name,el.type==='checkbox'?el.checked:el.value);
  if(r.v!=='edit')return;
  const def=F[r.def||r.col];
  if(def&&def.onChange)def.onChange(r.draft,el.name);
  if(el.tagName==='SELECT'||el.type==='checkbox'){render('keep');return}
  /* даты и текст: обновляем только зависимые поля, без перерисовки — иначе на iPhone закрывается выбор даты */
  $$('#form [name]').forEach(x=>{if(x===el||x.type==='checkbox'||x.tagName==='SELECT')return;const v=getPath(r.draft,x.name),sv=v==null?'':String(v);if(x.value!==sv)x.value=sv});
});

/* клавиатура на телефоне: подгоняем высоту под видимую область */
const vv=window.visualViewport;let lastVV='';
function fitViewport(){
  if(!vv)return;
  const h=Math.round(vv.height),t=Math.round(vv.offsetTop),key=h+'/'+t;
  if(key===lastVV)return;lastVV=key;
  document.body.style.height=h+'px';document.body.style.top=t+'px';
  document.body.classList.toggle('kb',h<window.innerHeight-120);
  window.scrollTo(0,0);
}
if(vv){vv.addEventListener('resize',fitViewport);vv.addEventListener('scroll',fitViewport);setInterval(fitViewport,200)}
document.addEventListener('focusin',e=>{const el=e.target;if(el.matches('input,textarea,select'))setTimeout(()=>el.scrollIntoView({block:'center',behavior:'smooth'}),300)});
fitViewport();

/* блокировка после паузы и синхронизация при возврате */
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){hiddenAt=Date.now();if(syncReady()&&dev.sync.auto!==false&&syncTimer){clearTimeout(syncTimer);syncNow(false)}return}
  if(dev.pin&&hiddenAt&&Date.now()-hiddenAt>=(+dev.pin.min||0)*6e4)showLock();
  if(genChargesIfNewDay())render('keep');
  if(syncReady()&&dev.sync.auto!==false&&Date.now()-(dev.lastSync||0)>60e3)syncNow(false);
});
let genDay=today();
function genChargesIfNewDay(){if(today()!==genDay){genDay=today();genCharges();return true}return false}

/* запуск */
applyTheme();
migrateHouses();
genCharges();
render('top');
if(dev.pin)showLock();
navigator.storage?.persist?.();
if(!IS_NATIVE&&'serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
if(syncReady()&&dev.sync.auto!==false)setTimeout(()=>syncNow(false),1200);
if(IS_NATIVE){
  try{NP.App.addListener('backButton',()=>{
    if($('#lock').classList.contains('on'))return;
    if(stack.length>1){back();return}
    if(tab!=='flats'){setTab('flats');return}
    NP.App.minimizeApp?NP.App.minimizeApp():NP.App.exitApp();
  })}catch(e){}
  document.addEventListener('click',e=>{const a=e.target.closest('a[href^="http"]');if(a){e.preventDefault();openExternal(a.href)}});
  setTimeout(()=>{if(Date.now()-(dev.apkchk||0)>864e5){dev.apkchk=Date.now();saveDev();checkUpdateNative(true)}},4000);
}
